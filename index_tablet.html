﻿<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- 빈 favicon: 브라우저가 자동 요청하는 /favicon.ico 404 콘솔 노이즈 제거용. -->
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rladiddus/comsw@main/assets/fonts/paperlogy.css">
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/supabase-client.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh;
      overflow: hidden; background: #000;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    }
    #viewer {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    #media-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 110%;
      height: 110%;
      transform: translate(-50%, -50%) translate(var(--parallax-x, 0%), var(--parallax-y, 0%));
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #media-container img,
    #media-container video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    
    .iframe-wrapper {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .iframe-wrapper iframe {
      display: block;
      border: none;
    }
    
    #caption {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      pointer-events: none;
      max-width: 90vw;
      padding: 0 20px;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 0.98;
    }
    
    .caption-line {
      display: block;
      line-height: 0.98;
    }
    
    .line-1, .line-2, .line-3, .line-other { font-size: clamp(1rem, 2vw, 1.5rem); }
    .line-1 { margin-top: 0; }
    .line-2, .line-3, .line-other { margin-top: 0.14rem; }
    
    .red-highlight {
      font-family: 'Great Vibes', cursive;
      color: #ffffff;
      font-size: 1.25em;
      font-weight: 400;
      display: inline-block;
    }
    
    /* 하단 메뉴 시스템 - 태블릿: 상시 노출 */
    #menu-area {
      position: fixed;
      bottom: 4vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      pointer-events: none;
      max-width: calc(100vw - 40px);
      font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
    }

  .menu-item {
    background: #ffffff;
    color: #000;
    font-weight: 500;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 24px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    opacity: 1;
    pointer-events: auto;
    position: relative;
    z-index: 1;
    user-select: none;
    letter-spacing: -0.01em;
    transition: background-color 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease;
  }

  .menu-item:hover {
    background: #f0f0f0;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    transform: translateY(-1px);
  }
    
    .message {
      color: #fff; font-size: 1.2rem;
      text-align: center; padding: 2rem;
    }
    .error { color: #ff6b6b; }
    
    .fade-in { animation: fadeIn 0.6s ease-in; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* ============================================== */
    /*  🎯 로딩 화면                                     */
    /* ============================================== */
    
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 9999;
      background: #000;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.6s ease-out;
    }
    
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    #loading-overlay.lock {
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    
    #loading-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    
    #loading-dim {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
    }
    
    #loading-text-wrapper {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 90vw;
      text-align: center;
    }
    
    .wipe-text {
      font-family: 'Paperlogy', 'Great Vibes', cursive;
      font-weight: 800;
      font-size: clamp(1.25rem, 3.5vw, 3rem);
      line-height: 1.2;
      position: relative;
      display: inline-block;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .wipe-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      color: rgba(255, 255, 255, 1);
      clip-path: inset(0 calc(100% - var(--loading-progress, 0%)) 0 0);
      transition: clip-path 0.35s cubic-bezier(0.65, 0, 0.35, 1);
    }
    
    .wipe-text.animate::after {
      transition-duration: 0.35s;
    }
    
    @keyframes wipeIn {
      0%   { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <img id="loading-bg" src="" alt="">
    <div id="loading-dim"></div>
    <div id="loading-text-wrapper">
      <span class="wipe-text" id="loading-text" data-text=""></span>
    </div>
  </div>
  
  <div id="viewer">
    <div id="media-container">
      <div class="message" style="opacity:0;">불러오는 중...</div>
    </div>
  </div>
  <div id="caption"></div>
  
  <div id="menu-area">
    <!-- 태블릿: onMenuLoaded가 직접 .menu-item을 여기에 추가 -->
  </div>

  <script>
    let mediaList = [];
    let currentIndex = 0;
    let slideTimer = null;
    const IMAGE_DURATION = 8000;
    const MAX_PARALLAX = 4.5;
    
    const LOADING_CACHE_KEY = 'loading_image_cache_v1';
    const LOADING_LIST_CACHE_KEY = 'loading_list_cache_v1';
    
    let mediaReady = false;
    let firstMediaPlayable = false;
    let menuReady = false;
    let loadingContentReady = false;
    let webAppUrlReady = false;
    let domReady = false;
    const MIN_LOADING_TIME = 2500;
    const MAX_LOADING_TIME = 8000;
    const loadingStartTime = Date.now();
    const loadingProgressSteps = {
      dom: 5,
      loadingContent: 15,
      menu: 20,
      media: 25,
      firstMedia: 25,
      webAppUrl: 10
    };
    const loadingProgressDone = {};
    
    let cachedWebAppUrl = null;
    
    // 🎯 핵심: 로딩 콘텐츠를 한 번 결정하면 절대 안 바뀜
    let isLoadingContentDisplayed = false;

    function normalizeText(value) {
      return window.ComswSupabase
        ? window.ComswSupabase.normalizeText(value)
        : String(value == null ? '' : value).trim();
    }

    function truthyCell(value) {
      return window.ComswSupabase
        ? window.ComswSupabase.truthyCell(value)
        : value === true;
    }

    function convertDriveUrl(url) {
      return window.ComswSupabase
        ? window.ComswSupabase.convertDriveUrl(url)
        : normalizeText(url);
    }

    function getRawValues(row) {
      return window.ComswSupabase
        ? window.ComswSupabase.getRawValues(row)
        : ((row && row.data && row.data.values) || []);
    }

    function hashString(text) {
      let hash = 0;
      const str = String(text || '');
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      return Math.abs(hash).toString(16);
    }

    async function getMainRows() {
      return window.ComswSupabase.fetchSheetRows(window.COMSW_SUPABASE_CONFIG.sheets.main);
    }

    async function getLoadingRows() {
      return window.ComswSupabase.fetchSheetRows('로딩 중');
    }

    function detectMediaTypeForIndex(url) {
      const raw = String(url || '').toLowerCase();
      if (raw.includes('youtube.com') || raw.includes('youtu.be')) return 'youtube';
      if (raw.includes('vimeo.com')) return 'vimeo';
      // 확장자가 명확한 영상
      if (/\.(mp4|webm|mov|ogg)(\?|#|$)/.test(raw)) return 'video';
      // Apps Script 원본의 detectMediaType과 일치시킴 — 확장자 없는 video host들
      if (raw.includes('pexels.com') && raw.includes('/download/video/')) return 'video';
      if (raw.includes('pixabay.com') && raw.includes('/videos/')) return 'video';
      if (raw.includes('coverr.co')) return 'video';
      // 확장자가 명확한 이미지
      if (/\.(jpe?g|png|gif|webp|bmp|svg|avif)(\?|#|$)/.test(raw)) return 'image';
      // Google Drive — 클라이언트에서는 MIME 검사 불가. 메인 페이지 배경은 영상이
      // 일반적이므로 'gdrive-video'로 먼저 시도하고, 실패 시 onerror에서 fallback.
      // (Apps Script 원본은 DriveApp.getFileById()로 MIME을 정확히 판정했지만,
      //  브라우저에서는 그게 불가능하므로 사용 패턴에 맞춰 영상으로 가정한다.)
      if (raw.includes('drive.google.com')) return 'gdrive-video';
      return 'image';
    }

    function captionTextToHtml(text) {
      return escapeHtml(text || '').replace(/\n/g, '<br>');
    }

    async function getCheckedMediaFromSupabase() {
      const rows = await getMainRows();
      return rows.map(function(row) {
        const values = getRawValues(row);
        const url = normalizeText(values[0]);
        const caption = normalizeText(values[1]);
        const checked = values[2];
        if (!url || !truthyCell(checked)) return null;
        // Drive URL은 변환하지 않고 raw 그대로 둔다.
        //  - detectMediaTypeForIndex가 'gdrive-video' 등으로 분류한 뒤
        //    renderMedia가 extractDriveId로 ID를 다시 뽑아 적절한 endpoint를 만든다.
        //  - convertDriveUrl이 모든 Drive URL을 thumbnail 이미지 URL로 변환해버리면,
        //    영상 파일이 정지 이미지(또는 검은 화면)로 표시되는 버그가 생긴다.
        const isDrive = url.toLowerCase().indexOf('drive.google.com') !== -1;
        const finalUrl = isDrive ? url : convertDriveUrl(url);
        return {
          url: finalUrl,
          type: detectMediaTypeForIndex(finalUrl),
          captionHtml: captionTextToHtml(caption)
        };
      }).filter(Boolean);
    }

    async function getMenuListFromSupabase() {
      const rows = await getMainRows();
      const menus = rows.map(function(row) {
        const values = getRawValues(row);
        const name = normalizeText(values[4]);
        const checked = values[5];
        const direction = normalizeText(values[6]);
        const order = Number(values[7]) || 999;
        if (!name || !truthyCell(checked)) return null;

        let dir = direction.toLowerCase();
        if (dir === '왼쪽' || dir === 'left' || dir === 'l') dir = 'left';
        else if (dir === '오른쪽' || dir === 'right' || dir === 'r') dir = 'right';
        else dir = 'right';

        return {
          name: name,
          direction: dir,
          order: order
        };
      }).filter(Boolean);

      menus.sort(function(a, b) { return a.order - b.order; });
      return menus;
    }

    async function getLoadingContentFromSupabase() {
      const rows = await getLoadingRows();
      return rows.map(function(row) {
        const values = getRawValues(row);
        const rawUrl = normalizeText(values[0]);
        const text = normalizeText(values[1]);
        const checked = values[2];
        const fontFamily = normalizeText(values[3]);
        const fontSize = normalizeText(values[4]);
        const fontWeight = normalizeText(values[5]);
        if (!rawUrl || !truthyCell(checked)) return null;
        const imageUrl = convertDriveUrl(rawUrl);
        return {
          id: 'loading_' + hashString(imageUrl),
          imageUrl: imageUrl,
          text: text,
          fontFamily: fontFamily,
          fontSize: fontSize,
          fontWeight: fontWeight
        };
      }).filter(Boolean);
    }

    function setLoadingProgress(percent) {
      document.documentElement.style.setProperty('--loading-progress', Math.max(0, Math.min(100, percent)) + '%');
    }

    function markLoadingStep(step) {
      loadingProgressDone[step] = true;
      let progress = 0;
      Object.keys(loadingProgressSteps).forEach(function(key) {
        if (loadingProgressDone[key]) progress += loadingProgressSteps[key];
      });
      setLoadingProgress(progress);
      tryHideLoadingOverlay();
    }

    function isInitialPageReady() {
      return domReady && loadingContentReady && menuReady && mediaReady && firstMediaPlayable && webAppUrlReady;
    }
    
    /* ============================================== */
    /*  🎯 페이지 진입 시 - 로딩 화면 표시                 */
    /* ============================================== */
    
    document.addEventListener('DOMContentLoaded', function() {
      tryDisplayCachedContent();
    });
    
    function tryDisplayCachedContent() {
      // 이미 표시했으면 절대 다시 안 함
      if (isLoadingContentDisplayed) return;
      
      let cachedList = null;
      try {
        const raw = localStorage.getItem(LOADING_LIST_CACHE_KEY);
        if (raw) cachedList = JSON.parse(raw);
      } catch (e) {}
      
      if (cachedList && cachedList.length > 0) {
        const picked = cachedList[Math.floor(Math.random() * cachedList.length)];
        displayLoadingContent(picked);
        isLoadingContentDisplayed = true;  // 🎯 표시 완료 플래그
      }
      // 캐시 없으면 아무것도 안 함 → 검은 화면 유지
      // 서버 응답 오면 그때 표시됨
    }
    
    function displayLoadingContent(item) {
      const bg = document.getElementById('loading-bg');
      const textEl = document.getElementById('loading-text');
      
      const cachedImage = getCachedImage(item.id);
      if (cachedImage) {
        bg.src = cachedImage;
      } else if (item.imageUrl) {
        bg.src = item.imageUrl;
        cacheImageAsBase64(item.id, item.imageUrl);
      }
      
      textEl.textContent = item.text || '';
      textEl.setAttribute('data-text', item.text || '');
      if (typeof applyLoadingFont === 'function') applyLoadingFont(textEl, item);

      textEl.classList.remove('animate');
      void textEl.offsetWidth;
      textEl.classList.add('animate');
    }
    
    /* ============================================== */
    /*  🎯 이미지 base64 캐싱                            */
    /* ============================================== */
    
    function getCachedImage(id) {
      try {
        const raw = localStorage.getItem(LOADING_CACHE_KEY);
        if (!raw) return null;
        const cache = JSON.parse(raw);
        return cache[id] || null;
      } catch (e) {
        return null;
      }
    }
    
    // GitHub Pages 환경에서는 Drive thumbnail이 CORS 헤더를 안 보내서 fetch가
    // 반드시 차단된다. base64 캐시 없이도 <img src="...">는 그냥 잘 표시되므로,
    // 여기서는 캐시 시도 자체를 skip해 콘솔 노이즈를 제거한다.
    //
    // 만약 Apps Script 환경으로 다시 돌아가거나 외부 CDN으로 이미지를 옮기면
    // 이 함수를 원래 fetch 기반으로 되돌리면 된다.
    function cacheImageAsBase64(id, url) {
      // no-op
    }
    
    /* ============================================== */
    /*  🎯 메인 콘텐츠 로드                              */
    /* ============================================== */
    
    window.onload = function() {
      domReady = true;
      markLoadingStep('dom');

      // 로딩 콘텐츠 - 백그라운드에서 캐시 갱신만, 화면 표시는 안 함
      getLoadingContentFromSupabase()
        .then(function(list) {
          if (list && list.length > 0) {
            try {
              localStorage.setItem(LOADING_LIST_CACHE_KEY, JSON.stringify(list));
            } catch (e) {}
            
            // 🎯 만약 아직 화면에 콘텐츠가 표시 안 됐다면 (캐시 없었던 경우)
            //    이때 처음 한 번만 표시
            if (!isLoadingContentDisplayed) {
              const picked = list[Math.floor(Math.random() * list.length)];
              displayLoadingContent(picked);
              isLoadingContentDisplayed = true;
            }
            
            // 백그라운드 이미지 캐싱
            list.forEach(item => {
              if (!getCachedImage(item.id) && item.imageUrl) {
                cacheImageAsBase64(item.id, item.imageUrl);
              }
            });
          }
          loadingContentReady = true;
          markLoadingStep('loadingContent');
        })
        .catch(function(e){
          console.error('로딩 콘텐츠 실패:', e);
          loadingContentReady = true;
          markLoadingStep('loadingContent');
        });
      
      getCheckedMediaFromSupabase()
        .then(onMediaLoaded)
        .catch(onError);
      
      getMenuListFromSupabase()
        .then(onMenuLoaded)
        .catch(function(e){
          console.error('메뉴 로드 실패:', e);
          menuReady = true;
          markLoadingStep('menu');
        });
      
      cachedWebAppUrl = '';
      webAppUrlReady = true;
      markLoadingStep('webAppUrl');
      
      initParallax();
      initMenuVisibility();
      
      setTimeout(function() {
        tryHideLoadingOverlay(true);
      }, MAX_LOADING_TIME);
    };
    
    /* ============================================== */
    /*  🎯 로딩 화면 숨김                                */
    /* ============================================== */
    
    function tryHideLoadingOverlay(force) {
      const elapsed = Date.now() - loadingStartTime;
      const overlay = document.getElementById('loading-overlay');
      
      if (overlay.classList.contains('lock')) return;
      
      if (force) {
        if (isInitialPageReady()) {
          setLoadingProgress(100);
          overlay.classList.add('hidden');
        }
        return;
      }
      
      if (isInitialPageReady() && elapsed >= MIN_LOADING_TIME) {
        setLoadingProgress(100);
        overlay.classList.add('hidden');
      } else if (isInitialPageReady() && elapsed < MIN_LOADING_TIME) {
        setTimeout(function() {
          if (!overlay.classList.contains('lock')) {
            setLoadingProgress(100);
            overlay.classList.add('hidden');
          }
        }, MIN_LOADING_TIME - elapsed);
      }
    }
    
    /* ============================================== */
    /*  🎯 메뉴 클릭 - 페이지 이동                       */
    /*    🔑 현재 표시 중인 콘텐츠 그대로 유지하면서 이동  */
    /* ============================================== */
    
  function onMenuClick(name) {
    const pageMap = {
      '전체 수업': 'roadmap_tablet.html',
      '학과별 자료': 'Curriculum_full_tablet.html',
      '학과 커리큘럼': 'Curriculum_onepage_tablet.html',
      '특강/세미나': 'seminar_tablet.html',
      '수업별 준비물': 'item_tablet.html',
      '방학 특강': 'vacation_tablet.html'
    };
    
    const targetPage = pageMap[name];
    if (!targetPage) return;
    
    const overlay = document.getElementById('loading-overlay');
    const textEl = document.getElementById('loading-text');
    
    // 🎯 1단계: 페이지 이동 잠금
    setLoadingProgress(0);
    overlay.classList.add('lock');
    overlay.classList.remove('hidden');
    
    // 🎯 2단계: 콘텐츠 처리
    if (overlay.classList.contains('hidden') || !isLoadingContentDisplayed) {
      // 로딩 화면이 사라진 상태였음 → 새 콘텐츠 표시
      try {
        const raw = localStorage.getItem(LOADING_LIST_CACHE_KEY);
        if (raw) {
          const list = JSON.parse(raw);
          if (list.length > 0) {
            const picked = list[Math.floor(Math.random() * list.length)];
            displayLoadingContent(picked);  // 이 안에서 wipe 재시작됨
            isLoadingContentDisplayed = true;
          }
        }
      } catch (e) {}
      overlay.classList.remove('hidden');
    } else {
      // 🎯 로딩 화면이 보이는 상태였음 - 콘텐츠는 그대로 두고 wipe만 재시작!
      textEl.classList.remove('animate');
      void textEl.offsetWidth;  // 리플로우 강제 (애니메이션 재시작 트릭)
      textEl.classList.add('animate');
    }
    setLoadingProgress(25);
    
    // 🎯 3단계: wipe 완료 시점에 페이지 이동
    const navigate = function() {
      window.top.location.href = './' + targetPage;
    };
    
    requestAnimationFrame(function() { setLoadingProgress(100); });
    setTimeout(navigate, 2500);
  }
    

    
    /* ============================================== */
    /*  메뉴 시스템                                       */
    /* ============================================== */
    
    function onMenuLoaded(menus) {
      if (!menus || menus.length === 0) {
        menuReady = true;
        markLoadingStep('menu');
        return;
      }
      const container = document.getElementById('menu-area');
      // 태블릿: 순서대로 한 줄 배치
      const sorted = menus.slice().sort((a, b) => a.order - b.order);
      sorted.forEach(menu => container.appendChild(createMenuItem(menu)));
      menuReady = true;
      markLoadingStep('menu');
    }
    
    function createMenuItem(menu) {
      const div = document.createElement('div');
      div.className = 'menu-item';
      div.textContent = menu.name;
      div.onclick = function() { onMenuClick(menu.name); };
      return div;
    }
    
    function initMenuVisibility() {
      // 태블릿: CSS로 항상 보임 - 이벤트 핸들러 불필요
    }
    
    /* ============================================== */
    /*  미디어 및 패럴랙스                                */
    /* ============================================== */
    
    function initParallax() {
      const container = document.getElementById('media-container');
      document.addEventListener('mousemove', function(e) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const xRatio = (e.clientX / w) * 2 - 1;
        const yRatio = (e.clientY / h) * 2 - 1;
        const moveX = -xRatio * MAX_PARALLAX;
        const moveY = -yRatio * MAX_PARALLAX;
        container.style.setProperty('--parallax-x', moveX + '%');
        container.style.setProperty('--parallax-y', moveY + '%');
      });
      document.addEventListener('mouseleave', function() {
        container.style.setProperty('--parallax-x', '0%');
        container.style.setProperty('--parallax-y', '0%');
      });
      window.addEventListener('blur', function() {
        container.style.setProperty('--parallax-x', '0%');
        container.style.setProperty('--parallax-y', '0%');
      });
    }
    
    function onMediaLoaded(list) {
      mediaList = list || [];
      mediaReady = true;
      markLoadingStep('media');
      
      if (mediaList.length === 0) {
        document.getElementById('media-container').innerHTML = 
          '<div class="message">체크된 미디어가 없습니다.</div>';
        firstMediaPlayable = true;
        markLoadingStep('firstMedia');
        tryHideLoadingOverlay();
        return;
      }
      renderMedia(0);
    }
    
    function onError(err) {
      document.getElementById('media-container').innerHTML = 
        '<div class="message error">오류: ' + (err.message || err) + '</div>';
      mediaReady = true;
      firstMediaPlayable = true;
      markLoadingStep('media');
      markLoadingStep('firstMedia');
      tryHideLoadingOverlay();
    }
    
    function getCoverSize() {
      const w = window.innerWidth * 1.1;
      const h = window.innerHeight * 1.1;
      const videoRatio = 16 / 9;
      if (w / h > videoRatio) return { width: w, height: w / videoRatio };
      return { width: h * videoRatio, height: h };
    }
    
    function renderMedia(index) {
      currentIndex = index;
      const media = mediaList[index];
      const container = document.getElementById('media-container');
      const caption = document.getElementById('caption');
      const isSlideshow = mediaList.length > 1;
      
      if (slideTimer) {
        clearTimeout(slideTimer);
        slideTimer = null;
      }
      
      let html = '';
      
      switch (media.type) {
        case 'youtube': {
          const ytId = extractYouTubeId(media.url);
          if (ytId) {
            const size = getCoverSize();
            const params = ['autoplay=1','mute=1','controls=0','rel=0','showinfo=0',
                            'modestbranding=1','iv_load_policy=3','playsinline=1',
                            'loop=1','playlist=' + ytId,'disablekb=1'].join('&');
            html = '<div class="iframe-wrapper" style="width:' + size.width + 'px;height:' + size.height + 'px;">' +
                   '<iframe width="' + size.width + '" height="' + size.height + '" ' +
                   'src="https://www.youtube.com/embed/' + ytId + '?' + params + '" ' +
                   'frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';
          }
          break;
        }
        case 'vimeo': {
          const vmId = extractVimeoId(media.url);
          if (vmId) {
            const size = getCoverSize();
            html = '<div class="iframe-wrapper" style="width:' + size.width + 'px;height:' + size.height + 'px;">' +
                   '<iframe width="' + size.width + '" height="' + size.height + '" ' +
                   'src="https://player.vimeo.com/video/' + vmId + '?autoplay=1&muted=1&loop=1&background=1&controls=0" ' +
                   'frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>';
          }
          break;
        }
        case 'video':
          html = '<video id="localvideo" src="' + escapeHtml(media.url) + '" autoplay muted playsinline loop></video>';
          break;
        case 'gdrive-video': {
          const driveId = extractDriveId(media.url);
          if (!driveId) {
            html = '<img src="' + escapeHtml(media.url) + '" alt="media">';
            break;
          }
          // Drive `uc?export=download`는 작은 영상은 직접 스트리밍 되지만,
          // 일정 크기 이상이면 virus warning HTML로 redirect 되어 <video>가 검은 화면이 된다.
          // 그래서 <video>가 일정 시간 안에 재생을 시작하지 못하면 iframe `/preview`로 교체한다.
          const videoSrc = 'https://drive.google.com/uc?export=download&id=' + driveId;
          html = '<video id="localvideo" data-driveid="' + escapeHtml(driveId) + '" ' +
                 'src="' + escapeHtml(videoSrc) + '" autoplay muted playsinline loop></video>';
          break;
        }
        case 'gdrive-image': {
          const driveId = extractDriveId(media.url);
          html = '<img src="https://drive.google.com/thumbnail?id=' + driveId + '&sz=w2000" alt="media">';
          break;
        }
        case 'gdrive': {
          const driveId = extractDriveId(media.url);
          if (driveId) {
            const size = getCoverSize();
            html = '<div class="iframe-wrapper" style="width:' + size.width + 'px;height:' + size.height + 'px;">' +
                   '<iframe width="' + size.width + '" height="' + size.height + '" ' +
                   'src="https://drive.google.com/file/d/' + driveId + '/preview" ' +
                   'allow="autoplay" allowfullscreen></iframe></div>';
          } else {
            html = '<img src="' + escapeHtml(media.url) + '" alt="media">';
          }
          break;
        }
        case 'image':
        default:
          html = '<img src="' + escapeHtml(media.url) + '" alt="media">';
          break;
      }
      
      container.innerHTML = html;

      // 🎯 Drive 영상 fallback (모든 인덱스 대상)
      // `uc?export=download&id=...`는 작은 파일은 직접 스트리밍 되지만, 일정 크기 이상이면
      // virus warning HTML로 redirect 되어 <video>가 검은 화면이 된다.
      // canplay가 일정 시간 안에 안 오거나 error가 발생하면 iframe /preview로 교체.
      container.querySelectorAll('video[data-driveid]').forEach(function(videoEl) {
        const driveId = videoEl.dataset.driveid;
        if (!driveId) return;
        let resolved = false;
        let fallbackTimer = null;
        videoEl.addEventListener('canplay', function() {
          resolved = true;
          if (fallbackTimer) clearTimeout(fallbackTimer);
        });
        function doFallback() {
          if (resolved) return;
          resolved = true;
          const parent = videoEl.parentNode;
          if (!parent) return;
          const size = getCoverSize();
          const previewUrl = 'https://drive.google.com/file/d/' + driveId + '/preview';
          parent.innerHTML =
            '<div class="iframe-wrapper" style="width:' + size.width + 'px;height:' + size.height + 'px;">' +
              '<iframe width="' + size.width + '" height="' + size.height + '" ' +
                      'src="' + previewUrl + '" ' +
                      'allow="autoplay" allowfullscreen frameborder="0"></iframe>' +
            '</div>';
          if (!firstMediaPlayable) {
            firstMediaPlayable = true;
            markLoadingStep('firstMedia');
            tryHideLoadingOverlay();
          }
        }
        videoEl.addEventListener('error', doFallback);
        fallbackTimer = setTimeout(doFallback, 4000);
      });

      if (index === 0) {
        const videoEl = container.querySelector('video');
        const imgEl = container.querySelector('img');
        const iframeEl = container.querySelector('iframe');

        if (videoEl) {
          videoEl.addEventListener('canplay', function() {
            firstMediaPlayable = true;
            markLoadingStep('firstMedia');
            tryHideLoadingOverlay();
          });
          setTimeout(function() {
            if (!firstMediaPlayable) {
              firstMediaPlayable = true;
              markLoadingStep('firstMedia');
              tryHideLoadingOverlay();
            }
          }, 3000);
        } else if (imgEl) {
          imgEl.addEventListener('load', function() {
            firstMediaPlayable = true;
            markLoadingStep('firstMedia');
            tryHideLoadingOverlay();
          });
          imgEl.addEventListener('error', function() {
            firstMediaPlayable = true;
            markLoadingStep('firstMedia');
            tryHideLoadingOverlay();
          });
        } else if (iframeEl) {
          setTimeout(function() {
            firstMediaPlayable = true;
            markLoadingStep('firstMedia');
            tryHideLoadingOverlay();
          }, 2000);
        } else {
          firstMediaPlayable = true;
          markLoadingStep('firstMedia');
          tryHideLoadingOverlay();
        }
      }
      
      if (media.captionHtml) {
        const convertedHtml = media.captionHtml.replace(/class="cursive"/g, 'class="red-highlight"');
        const lines = convertedHtml.split(/<br\s*\/?>/i);
        caption.innerHTML = lines
          .map((line, i) => {
            const lineClass = i < 3 ? ('line-' + (i + 1)) : 'line-other';
            const cleanedLine = line.replace(/<span class="korean">([^<]*)<\/span>/g, '$1');
            return '<div class="caption-line ' + lineClass + '">' + cleanedLine + '</div>';
          })
          .join('');
      } else {
        caption.innerHTML = '';
      }
      
      container.classList.remove('fade-in');
      void container.offsetWidth;
      container.classList.add('fade-in');
      
      if (isSlideshow) scheduleNext(media.type);
    }
    
    function scheduleNext(type) {
      if (type === 'video' || type === 'gdrive-video') {
        slideTimer = setTimeout(goNext, 30000);
        return;
      }
      const duration = (type === 'youtube' || type === 'vimeo' || type === 'gdrive') ? 30000 : IMAGE_DURATION;
      slideTimer = setTimeout(goNext, duration);
    }
    
    function goNext() {
      renderMedia((currentIndex + 1) % mediaList.length);
    }
    
    window.addEventListener('resize', function() {
      if (mediaList.length > 0) renderMedia(currentIndex);
    });
    
    document.addEventListener('keydown', function(e) {
      if (mediaList.length < 2) return;
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') {
        renderMedia((currentIndex - 1 + mediaList.length) % mediaList.length);
      }
    });
    
    function extractYouTubeId(url) {
      const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([^&?\/\s]+)/);
      return match ? match[1] : null;
    }
    function extractVimeoId(url) {
      const match = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      return match ? match[1] : null;
    }
    function extractDriveId(url) {
      const match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 태블릿 터치 스와이프로 미디어 전환
    (function() {
      let touchStartX = 0;
      document.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });
      document.addEventListener('touchend', function(e) {
        if (!mediaList || mediaList.length < 2) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
          if (dx < 0) goNext();
          else renderMedia((currentIndex - 1 + mediaList.length) % mediaList.length);
        }
      }, { passive: true });
    })();
    </script>
</body>
