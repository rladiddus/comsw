<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Monomaniac+One&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rladiddus/comsw@main/assets/fonts/paperlogy.css">
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/supabase-client.js"></script>
  <style>
    :root {
      --accent-orange: #FF512F;
      --text-gray: #555;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100vh;
      overflow: hidden;
      background: #2a2a2a;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      color: #fff;
    }
    
    /* ============================================== */
    /*  가이드 라인                                       */
    /* ============================================== */
    
    .guide-h {
      position: fixed;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.25);
      z-index: 5;
      pointer-events: none;
    }
    .guide-h.top    { top: 40px; }
    .guide-h.bottom { bottom: 40px; }
    
    .guide-v {
      position: fixed;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.25);
      z-index: 5;
      pointer-events: none;
    }
    .guide-v.left   { left: 40px; }
    .guide-v.right {
      right: 40px;
      transition: right 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.panel-open .guide-v.right {
      right: calc(75vw + 40px);
    }
    /* 🎯 확대 상태에서는 오른쪽 가이드선 화면 밖으로 */
    body.panel-fullscreen .guide-v.right {
      right: calc(100vw + 40px);
    }
    
    .guide-cross {
      position: fixed;
      width: 14px; height: 14px;
      z-index: 6;
      pointer-events: none;
    }
    .guide-cross::before,
    .guide-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
    }
    .guide-cross::before {
      top: 50%; left: 0;
      width: 100%; height: 3px;
      transform: translateY(-50%);
    }
    .guide-cross::after {
      top: 0; left: 50%;
      width: 3px; height: 100%;
      transform: translateX(-50%);
    }
    .guide-cross.tl { top: 40px; left: 40px; transform: translate(-50%, -50%); }
    .guide-cross.bl { bottom: 40px; left: 40px; transform: translate(-50%, 50%); }
    .guide-cross.tr,
    .guide-cross.br {
      transition: right 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .guide-cross.tr { top: 40px; right: 40px; transform: translate(50%, -50%); }
    .guide-cross.br { bottom: 40px; right: 40px; transform: translate(50%, 50%); }
    body.panel-open .guide-cross.tr,
    body.panel-open .guide-cross.br {
      right: calc(75vw + 40px);
    }
    body.panel-fullscreen .guide-cross.tr,
    body.panel-fullscreen .guide-cross.br {
      right: calc(100vw + 40px);
    }
    
    /* ============================================== */
    /*  학과 목록                                         */
    /* ============================================== */
    
    #departments {
      position: fixed;
      top: 50%;
      left: 6.4vw;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      list-style: none;
    }
    
    .dept-item {
      cursor: pointer;
      list-style: none;
      font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
      font-weight: 300;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: -0.02em;
      line-height: 1.2;
      transition: 
        font-size 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        font-weight 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        color 0.2s ease;
      transform-origin: left center;
    }
    
    .dept-item:hover,
    .dept-item.active {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
    }
    
    /* ============================================== */
    /*  학과 설명                                         */
    /* ============================================== */
    
    #dept-description {
      position: fixed;
      /* 🎯 피그마 좌표 (1920×1080 기준)
         이미지 영역: left 765, top 277, w 769, h 510 → 가운데 (1149.5, 532) */
      left: 59.87vw;            /* (765 + 769/2) / 1920 = 59.87% */
      top: 49.26vh;             /* (277 + 510/2) / 1080 = 49.26% */
      transform: translate(-50%, -50%);
      z-index: 8;
      width: 40.05vw;           /* 769 / 1920 */
      max-width: 900px;
      aspect-ratio: 769 / 510;  /* 피그마 비율 유지 */
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #dept-description.visible { opacity: 1; }

    .dept-description-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    /* 왼쪽은 선명하게 유지되는 원본 이미지 */
    #dept-description-image {
      z-index: 1;
    }
    /* blur 레이어는 구조만 남기고 표시하지 않음 */
    #dept-description-image-blur {
      display: none !important;
    }
    #dept-description-image[src=""],
    #dept-description-image:not([src]),
    #dept-description-image-blur[src=""],
    #dept-description-image-blur:not([src]) {
      display: none;
    }

    /* 학과 설명 텍스트 (이미지 위에 흰글씨 + 검정 그림자) */
    #dept-description-text {
      position: absolute;
      left: 38%;             /* 이미지 중심보다 살짝 왼쪽에서 시작 */
      bottom: 0;
      width: 105%;           /* 이미지 오른쪽 밖으로 자연스럽게 확장 */
      transform: none;
      text-align: left;
      font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: clamp(0.77rem, 1.3125vw, 1.575rem);
      line-height: 1.4;
      color: #ffffff;
      letter-spacing: -0.02em;
      white-space: pre-line;
      text-shadow: -4px 0 5.5px rgba(0, 0, 0, 0.59),
                   0 2px 6px rgba(0, 0, 0, 0.45);
      word-break: keep-all;
      z-index: 3;
    }
    #dept-description-text:empty {
      display: none;
    }
    
    /* ============================================== */
    /*  슬라이드 패널                                     */
    /* ============================================== */
    
    #slide-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 75vw;
      background: #f6f6f6;
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    #slide-panel.open { transform: translateX(0); }
    
    /* 🎯 확대 상태 */
    #slide-panel.fullscreen { width: 100vw; }
    
    /* 패널 내부 가이드 */
    .panel-guide-h {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 5;
    }
    .panel-guide-h.top    { top: 40px; }
    .panel-guide-h.bottom { bottom: 40px; }
    
    .panel-guide-v {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 5;
    }
    .panel-guide-v.left  { left: 40px; }
    .panel-guide-v.right { right: 40px; }
    
    .panel-guide-cross {
      position: absolute;
      width: 14px; height: 14px;
      pointer-events: none;
      z-index: 6;
    }
    .panel-guide-cross::before,
    .panel-guide-cross::after {
      content: '';
      position: absolute;
      background: rgba(0, 0, 0, 0.5);
    }
    .panel-guide-cross::before {
      top: 50%; left: 0;
      width: 100%; height: 3px;
      transform: translateY(-50%);
    }
    .panel-guide-cross::after {
      top: 0; left: 50%;
      width: 3px; height: 100%;
      transform: translateX(-50%);
    }
    .panel-guide-cross.tl { top: 40px; left: 40px; transform: translate(-50%, -50%); }
    .panel-guide-cross.tr { top: 40px; right: 40px; transform: translate(50%, -50%); }
    .panel-guide-cross.bl { bottom: 40px; left: 40px; transform: translate(-50%, 50%); }
    .panel-guide-cross.br { bottom: 40px; right: 40px; transform: translate(50%, 50%); }
    
    /* ============================================== */
    /*  슬라이드 콘텐츠                                   */
    /* ============================================== */
    
    .slide-view {
      position: absolute;
      top: 40px;
      left: 40px;
      right: 40px;
      bottom: 40px;
      overflow: hidden;
    }
    
    #scale-container {
      position: absolute;
      transform-origin: top left;
      width: 1920px;
      height: 1080px;
    }
    
    .slide-page {
      width: 1920px;
      height: 1080px;
      background-color: #F6F6F6;
      padding: 60px 100px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      color: #111;
      z-index: 1;
    }
    .slide-page.active {
      opacity: 1;
      pointer-events: all;
    }
    
    .slide-header {
      display: flex;
      justify-content: space-between;
      padding-bottom: 16px;
      margin-bottom: 100px;
    }
    .slide-header .dept-eng,
    .slide-header .fixed-title {
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 0.5px;
      color: #111;
      text-transform: uppercase;
    }
    
    .main-body {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 80px;
      align-items: start;
    }
    
    .title-area {
      position: relative;
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .orange-circle {
      width: 110px; height: 110px;
      background-color: var(--accent-orange);
      border-radius: 50%;
      position: absolute;
      left: 0; top: 0;
      z-index: 1;
    }
    .subject-title {
      font-weight: 900;
      font-size: 64px;
      line-height: 1.15;
      color: #111;
      position: relative;
      z-index: 2;
      white-space: nowrap;
      display: block;
      max-width: 310px;
      overflow: hidden;
    }
    .subject-sub {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      color: #111;
      position: relative;
      z-index: 2;
      white-space: nowrap;
    }
    .page-badge {
      font-size: 28px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.3px;
      margin-top: 10px;
      position: relative;
      z-index: 2;
    }
    
    .weeks-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      width: 100%;
    }
    .weeks-container.cols-3 {
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }
    .weeks-container.cols-3 .week-card {
      width: calc(25% - 22px);
      flex-shrink: 0;
    }
    
    .week-card {
      display: flex;
      flex-direction: column;
    }
    
  .img-box {
      width: 100%;
      aspect-ratio: 269 / 391;
      background-color: #eaeaea;
      border-top-right-radius: 30px;
      border-bottom-left-radius: 30px;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      position: relative;
      cursor: pointer;                              /* 🎯 손가락 커서 */
      transition: box-shadow 0.3s ease;
    }
    .img-box:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);    /* 🎯 호버 시 그림자 강조 */
    }
    .img-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform 0.5s ease;
      pointer-events: none;                         /* 🎯 이미지가 이벤트 가로채지 않게 */
    }
    .img-box:hover img { transform: scale(1.1); }
    .no-img-text {
      font-size: 16px;
      color: #aaa;
      font-weight: 500;
      pointer-events: none;                         /* 🎯 텍스트도 이벤트 가로채지 않게 */
    }
    
    /* 🎯 박스 전체를 덮는 투명 오버레이 - 클릭/호버 영역 통일 */
    .img-box-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }
    
    .week-label {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #111;
    }
    .week-divider {
      width: 100%;
      height: 3px;
      background-color: var(--accent-orange);
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .week-content {
      font-size: 18px;
      color: var(--text-gray);
      line-height: 1.6;
      word-break: keep-all;
      font-weight: 500;
    }
    
    .slide-footer {
      padding-top: 24px;
      margin-top: 20px;
      font-size: 20px;
      font-weight: 300;
      color: #777777;
      letter-spacing: 0.5px;
    }
    
    /* ============================================== */
    /*  🎯 페이지 인디케이터 - 이미지 박스 중앙 정렬       */
    /* ============================================== */

    /* 슬라이드 콘텐츠의 이미지 박스 영역 중앙에 맞춤 */
    /* main-body의 grid-template-columns: 340px 1fr (gap: 80px) */
    /* → 좌측 타이틀 영역 + gap 이후 이미지들이 시작 */
    /* 패널 padding: 60px 100px → 슬라이드는 왼쪽에서 100px부터 */
    /* 이미지 박스 영역의 중심은 = (100 + 340 + 80 + (1920-540) / 2) ≈ 1090 (1920 기준) */
    /* 즉, 슬라이드 전체의 약 56.7% 위치 */

    #page-indicator {
      position: absolute;
      top: 1003px;             /* 🎯 footer "SBS ACADEMY ..." 텍스트 라인 (slide 1920x1080 좌표계) */
      left: 50%;               /* 🎯 슬라이드 좌우 정중앙 */
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 10px;
      z-index: 1000;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active {
      background: var(--accent-orange);
      transform: scale(1.3);
    }
    
    /* ============================================== */
    /*  🎯 첫/끝 페이지 네비게이션 (↑/↓)                 */
    /*    호버: 화면 오른쪽 100px 영역에서 등장          */
    /* ============================================== */

    #slide-nav {
      position: absolute;
      right: 60px;             /* 🎯 80 → 60 (오른쪽으로 이동) */
      top: 50%;
      transform: translate(80px, -50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s ease;
    }
    #slide-nav.visible {
      transform: translate(0, -50%);
      opacity: 1;
      pointer-events: auto;
    }

    /* ============================================== */
    /*  🎯 슬라이드 네비게이션 버튼 - SVG 화살표           */
    /* ============================================== */

    .slide-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.08);
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #111;
      padding: 0;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .slide-nav-btn:hover {
      background: rgba(0,0,0,0.15);
      transform: scale(1.08);
    }
    .slide-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 🎯 SVG 화살표 (>) - 회전으로 ↑/↓ 표현 */
    .nav-svg-arrow {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #111;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-svg-arrow.nav-up {
      transform: rotate(-90deg);
    }
    .nav-svg-arrow.nav-down {
      transform: rotate(90deg);
    }
    /* 호버 효과 - 회전 유지하면서 살짝 확대 */
    .nav-up:hover {
      transform: rotate(-90deg) scale(1.08);
    }
    .nav-down:hover {
      transform: rotate(90deg) scale(1.08);
    }
    
    .slide-empty {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #aaa;
      font-size: 18px;
    }
    
    /* ← 왼쪽 하단 (< 모양) */
    .back-btn {
      position: fixed;
      bottom: 60px;
      left: 60px;
      z-index: 500;
      width: 48px; height: 48px;
      padding: 0;
      background: #f6f6f6;
      color: #2a2a2a;
      border: none;
      border-radius: 50%;
      
      /* 🎯 폰트 관련 제거 (SVG로 변경) */
      
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      
      opacity: 0;
      pointer-events: none;
      transform: translateY(60px);
      transition: opacity 0.3s ease,
                  transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.4s ease,
                  color 0.4s ease;
    }
    .back-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .back-btn:hover {
      background: #fff;
    }

    /* 🎯 확대 상태에서 < 버튼 색상 반전 */
    body.panel-fullscreen .back-btn {
      background: #2a2a2a;
      color: #f6f6f6;
    }
    body.panel-fullscreen .back-btn:hover {
      background: #444;
    }

    /* 🎯 SVG 화살표 - 완벽 중앙 정렬 */
    .back-svg-arrow {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;    /* 🎯 버튼 color를 따라감 */
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* × 오른쪽 하단 */
    .close-btn {
      position: fixed;
      bottom: 60px;
      right: 60px;
      z-index: 500;
      width: 48px; height: 48px;
      padding: 0;
      background: #2a2a2a;
      color: #f6f6f6;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      
      opacity: 0;
      pointer-events: none;
      transform: translateY(60px);
      transition: opacity 0.3s ease,
                  transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.2s ease;
    }
    .close-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .close-btn:hover { background: #444; }
    
    /* 🎯 확대 버튼 - × 왼쪽 */
    .expand-btn {
      position: fixed;
      bottom: 60px;
      right: 120px;        /* close-btn (60px + 48px width) + 12px gap */
      z-index: 500;
      width: 48px; height: 48px;
      padding: 0;
      background: #2a2a2a;
      color: #f6f6f6;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      
      opacity: 0;
      pointer-events: none;
      transform: translateY(60px);
      transition: opacity 0.3s ease,
                  transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.2s ease;
    }
    .expand-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .expand-btn:hover { background: #444; }
    
    .expand-btn svg {
      width: 20px;
      height: 20px;
      stroke: #f6f6f6;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* ============================================== */
    /*  로딩 화면                                         */
    /* ============================================== */
    
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;

    #loading-bg {

      transition-duration: 0.35s;

    @keyframes wipeIn {
      0%   { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }

    /* ============================================== */

  </style>
  <!-- 🎯 카테고리별 페이지 모듈 include -->
  <!-- ============================================== -->
<!--  🎯 커리큘럼 카테고리 페이지 (기존 디자인 유지) -->
<!-- ============================================== -->

<script>
  /**
   * 커리큘럼 카테고리 - 학과의 과목별/주차별 슬라이드들을 생성
   * @param {string} deptName - 학과명 (예: "시각편집학과")
   * @param {string} engHeader - 영문 헤더 (예: "VISUAL EDITING")
   * @param {Array} subjects - 과목 배열 (서버에서 받은 데이터)
   * @returns {Array<HTMLElement>} 생성된 슬라이드 요소 배열
   */
  function createCurriculumPages(deptName, engHeader, subjects) {
    const slides = [];
    
    // 🎯 라이트박스용 - 학과 전체 주차를 평탄화한 배열 만들기
    // [{ subjectName, week: {title, content, img} }, ...]
    window.flatWeeksForLightbox = [];
    if (subjects && subjects.length > 0) {
      subjects.forEach(subject => {
        subject.weeks.forEach(week => {
          window.flatWeeksForLightbox.push({
            subjectName: subject.subjectName,
            week: week
          });
        });
      });
    }
    
    if (!subjects || subjects.length === 0) {
      const emptySlide = document.createElement('div');
      emptySlide.className = 'slide-page';
      emptySlide.innerHTML = ''
        + '<div class="slide-header">'
        + '<span class="dept-eng">' + escapeHtml(engHeader || '') + '</span>'
        + '<span class="fixed-title">학과 전체 과목 커리큘럼</span>'
        + '</div>'
        + '<div class="main-body">'
        + '<div style="grid-column: 1 / -1; text-align: center; padding: 100px; color: #999;">커리큘럼 데이터가 없습니다.</div>'
        + '</div>'
        + '<div class="slide-footer">SBS ACADEMY COMPUTER ART SUWON</div>';
      slides.push(emptySlide);
      return slides;
    }
    
    subjects.forEach(subject => {
      const weeks = subject.weeks;
      if (weeks.length <= 4) {
        const slide = makeCurriculumSlide(engHeader, subject, weeks, '');
        slides.push(slide);
      } else {
        const chunks = chunkWeeks(weeks, 3);
        chunks.forEach((chunk, idx) => {
          const label = (idx + 1) + ' / ' + chunks.length;
          const slide = makeCurriculumSlide(engHeader, subject, chunk, label);
          slides.push(slide);
        });
      }
    });
    
    return slides;
  }
  
  function chunkWeeks(weeks, size) {
    const result = [];
    for (let i = 0; i < weeks.length; i += size) {
      result.push(weeks.slice(i, i + size));
    }
    return result;
  }
  
  function makeCurriculumSlide(engHeader, subject, weekChunk, pageLabel) {
    const slide = document.createElement('div');
    slide.className = 'slide-page';
    
    const isCols3 = weekChunk.length === 3;
    const containerClass = 'weeks-container' + (isCols3 ? ' cols-3' : '');
    const badgeHTML = pageLabel
      ? '<span class="page-badge">' + escapeHtml(pageLabel) + '</span>'
      : '';
    
    // 🎯 준비물/교재/AI툴 데이터가 있는 과목이면 "커리큘럼" 옆에 외부링크 아이콘 표시
    const prepData = getCoursePrepForSubject(subject.subjectName);
    const prepIconHTML = prepData ? buildCoursePrepIconHTML(subject.subjectName) : '';

    slide.innerHTML = ''
      + '<div class="slide-header">'
      + '<span class="dept-eng">' + escapeHtml(engHeader || '') + '</span>'
      + '<span class="fixed-title">학과 전체 과목 커리큘럼</span>'
      + '</div>'
      + '<div class="main-body">'
      + '<div class="title-area">'
      + '<div class="orange-circle"></div>'
      + '<span class="subject-title">' + escapeHtml(subject.subjectName) + '</span>'
      + '<span class="subject-sub-wrap">'
      +   '<span class="subject-sub">커리큘럼</span>'
      +   prepIconHTML
      + '</span>'
      + badgeHTML
      + '</div>'
      + '<div class="' + containerClass + '">'
      + makeWeeksHTML(weekChunk, subject.subjectName)
      + '</div>'
      + '</div>'
      + '<div class="slide-footer">SBS ACADEMY COMPUTER ART SUWON</div>';
    
    setTimeout(() => {
      const titleEl = slide.querySelector('.subject-title');
      if (titleEl) fitTitleSize(titleEl);
    }, 0);

    // 🎯 준비물 아이콘 클릭 → 팝업 열기
    setTimeout(() => {
      const iconBtn = slide.querySelector('.course-prep-icon');
      if (iconBtn) {
        iconBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          const subjName = iconBtn.dataset.subject;
          openCoursePrepPopup(subjName);
        });
      }
    }, 0);
    
    // 🎯 썸네일 클릭 이벤트 등록
        setTimeout(() => {
          const imgBoxes = slide.querySelectorAll('.img-box');
          imgBoxes.forEach(box => {
            box.addEventListener('click', function(e) {
              // 🎯 currentTarget으로 확실하게 img-box 요소 참조
              const target = e.currentTarget;
              const subjectName = target.dataset.subject;
              const weekTitle = target.dataset.week;
              
              if (!subjectName || !weekTitle) {
                console.warn('[Lightbox] dataset missing', target);
                return;
              }
              
              // 평탄화 배열에서 인덱스 찾기
              const idx = window.flatWeeksForLightbox.findIndex(item =>
                item.subjectName === subjectName && item.week.title === weekTitle
              );
              if (idx >= 0) {
                openLightbox(idx);
              } else {
                console.warn('[Lightbox] index not found:', subjectName, weekTitle);
              }
            });
          });
        }, 0);
    
    return slide;
  }
  
    function makeWeeksHTML(weekChunk, subjectName) {
      return weekChunk.map(week => {
        let mediaHTML;
        if (week.img) {
          // 🎯 img 태그 + 클릭 가로채기 방지용 오버레이
          mediaHTML = '<img src="' + escapeAttr(week.img) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'
                    + '<span class="no-img-text" style="display:none;">참고 이미지 없음</span>'
                    + '<div class="img-box-overlay"></div>';
        } else {
          mediaHTML = '<span class="no-img-text">참고 이미지 없음</span>'
                    + '<div class="img-box-overlay"></div>';
        }
        
        // 🎯 img-box에 data 속성 추가 (라이트박스용)
        return '<div class="week-card">'
          + '<div class="img-box" data-subject="' + escapeAttr(subjectName) + '" data-week="' + escapeAttr(week.title) + '">' + mediaHTML + '</div>'
          + '<div class="week-label">' + escapeHtml(week.title) + '</div>'
          + '<div class="week-divider"></div>'
          + '<div class="week-content">' + escapeHtml(week.content) + '</div>'
          + '</div>';
      }).join('');
    }
  
  function fitTitleSize(el) {
    let fontSize = 64;
    el.style.fontSize = fontSize + 'px';
    while (el.scrollWidth > 310 && fontSize > 20) {
      fontSize -= 2;
      el.style.fontSize = fontSize + 'px';
    }
  }

  /* ============================================== */
  /*  🎯 준비물/교재/AI툴 아이콘 + 팝업                  */
  /* ============================================== */

  function normalizeCoursePrepSubjectName(value) {
    return String(value == null ? '' : value)
      .replace(/[\u200B\u200C\u200D\uFEFF\u00A0]/g, '')
      .replace(/[～〜]/g, '~')
      .replace(/\s+/g, '')
      .trim()
      .toLowerCase();
  }

  function getCoursePrepIndex() {
    const prepMap = window.coursePreparations || {};
    const cache = window._coursePreparationsIndex;
    if (cache && cache.source === prepMap) return cache.index;

    const index = {};
    Object.keys(prepMap).forEach(function(subjectName) {
      const key = normalizeCoursePrepSubjectName(subjectName);
      if (key && !index[key]) index[key] = prepMap[subjectName];
    });

    window._coursePreparationsIndex = {
      source: prepMap,
      index: index
    };
    return index;
  }

  function getCoursePrepForSubject(subjectName) {
    const key = normalizeCoursePrepSubjectName(subjectName);
    if (!key) return null;
    return getCoursePrepIndex()[key] || null;
  }

  /* "커리큘럼" 글자 옆에 들어갈 외부링크 SVG 아이콘 HTML */
  function buildCoursePrepIconHTML(subjectName) {
    return ''
      + '<button type="button" class="course-prep-icon" '
      +   'data-subject="' + escapeAttr(subjectName) + '" '
      +   'title="과목 준비물 보기">'
      +   '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">'
      +     '<path d="M14.9849 2C14.4327 2 13.9849 2.44771 13.9849 3C13.9849 3.55228 14.4327 4 14.9849 4L18.5858 4L10.2929 12.2929C9.90237 12.6834 9.90237 13.3166 10.2929 13.7071C10.6834 14.0976 11.3166 14.0976 11.7071 13.7071L20 5.41422L20 9.01503C20 9.56732 20.4477 10.015 21 10.015C21.5523 10.015 22 9.56732 22 9.01504L22 3C22 2.44772 21.5523 2 21 2L14.9849 2Z" fill="currentColor"/>'
      +     '<path d="M4 8C4 7.44772 4.44772 7 5 7H11.3333C11.8856 7 12.3333 6.55228 12.3333 6C12.3333 5.44772 11.8856 5 11.3333 5H5C3.34315 5 2 6.34315 2 8V19C2 20.6569 3.34315 22 5 22H16C17.6569 22 19 20.6569 19 19V13.2619C19 12.7096 18.5523 12.2619 18 12.2619C17.4477 12.2619 17 12.7096 17 13.2619V19C17 19.5523 16.5523 20 16 20H5C4.44772 20 4 19.5523 4 19V8Z" fill="currentColor"/>'
      +   '</svg>'
      + '</button>';
  }

  /* 🎯 데이터가 늦게 도착했을 때, 이미 빌드된 커리큘럼 슬라이드들에 아이콘을 보강
     - subject-sub-wrap에 .course-prep-icon이 없는 경우에만 추가 */
  function injectMissingPrepIcons() {
    document.querySelectorAll('.slide-page .title-area').forEach(function(area) {
      const titleEl = area.querySelector('.subject-title');
      if (!titleEl) return;
      const subjectName = titleEl.textContent || '';
      if (!subjectName || !getCoursePrepForSubject(subjectName)) return;

      const wrap = area.querySelector('.subject-sub-wrap');
      if (!wrap) return;
      if (wrap.querySelector('.course-prep-icon')) return;  // 이미 있음

      // 아이콘 추가 + 클릭 이벤트
      wrap.insertAdjacentHTML('beforeend', buildCoursePrepIconHTML(subjectName));
      const iconBtn = wrap.querySelector('.course-prep-icon');
      if (iconBtn) {
        iconBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          openCoursePrepPopup(iconBtn.dataset.subject);
        });
      }
    });
  }

  /* 팝업 열기 - 한 과목의 모든 카테고리(교재명/준비물/AI툴)를 한 팝업에 표시 */
  function openCoursePrepPopup(subjectName) {
    const prep = getCoursePrepForSubject(subjectName);
    if (!prep) return;

    // 팝업 wrapper 보장 (한 번만 body에 추가)
    let overlay = document.getElementById('course-prep-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'course-prep-overlay';
      overlay.className = 'course-prep-overlay';
      overlay.innerHTML = '<div class="course-prep-box" id="course-prep-box"></div>';
      document.body.appendChild(overlay);

      // 바깥 클릭으로 닫기
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeCoursePrepPopup();
      });
    }

    // 본문 채우기
    const box = overlay.querySelector('.course-prep-box');
    box.innerHTML = buildCoursePrepBoxHTML(subjectName, prep);
    overlay.classList.add('visible');

    // ESC 핸들러 (한 번만 등록)
    if (!window._coursePrepEscInit) {
      window._coursePrepEscInit = true;
      window.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        const o = document.getElementById('course-prep-overlay');
        if (o && o.classList.contains('visible')) {
          closeCoursePrepPopup();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }, true);
    }
  }

  function closeCoursePrepPopup() {
    const overlay = document.getElementById('course-prep-overlay');
    if (overlay) overlay.classList.remove('visible');
  }

  function coursePrepItems(value) {
    if (!value) return [];
    return Array.isArray(value) ? value : [value];
  }

  function prepTitleHTML(subjectName, suffix) {
    const titleText = subjectName + ' ' + suffix;
    const len = titleText.replace(/\s+/g, '').length;
    let fontSize = 44;
    if (len >= 18) fontSize = 32;
    else if (len >= 15) fontSize = 36;
    else if (len >= 12) fontSize = 40;
    return '<h3 class="prep-title" style="font-size:' + fontSize + 'px;">' + escapeHtml(titleText) + '</h3>';
  }

  /* 팝업 박스 내용 구성 - B열 카테고리별로 섹션 */
  function buildCoursePrepBoxHTML(subjectName, prep) {
    let html = ''
      + '<button type="button" class="course-prep-close" aria-label="닫기" '
      +   'onclick="closeCoursePrepPopup()">×</button>';

    // (A) 교재명
    if (prep.textbook) {
      const items = coursePrepItems(prep.textbook);
      const itemHtml = items.map(function(t) {
        const imgHtml = t.image
          ? '<img class="prep-image" src="' + escapeAttr(t.image) + '" alt="" '
            + 'onerror="this.style.display=\'none\';">'
          : '';
        const linkOpen  = t.link ? '<a class="prep-image-link" href="' + escapeAttr(t.link) + '" target="_blank" rel="noopener">' : '';
        const linkClose = t.link ? '</a>' : '';
        return ''
          + '<div class="prep-item">'
          +   (imgHtml ? ('<div class="prep-image-wrap">' + linkOpen + imgHtml + linkClose + '</div>') : '')
          +   (t.text ? '<div class="prep-text-medium">' + escapeHtml(t.text) + '</div>' : '')
          +   (t.pill ? '<div class="prep-pill prep-pill-big">' + escapeHtml(t.pill) + '</div>' : '')
          + '</div>';
      }).join('');
      html += ''
        + '<section class="course-prep-section section-textbook">'
        +   prepTitleHTML(subjectName, '교재명')
        +   '<div class="prep-divider"></div>'
        +   itemHtml
        + '</section>';
    }

    // (B) 준비물
    if (prep.supply) {
      const items = coursePrepItems(prep.supply);
      // C열에 콤마/줄바꿈/괄호로 줄 분리
      const lines = items
        .map(function(t) { return String(t.text || ''); })
        .join('\n')
        .split(/\r?\n|(?=\()/)
        .map(function(s){ return s.trim(); })
        .filter(Boolean);
      const linesHtml = lines.length > 0
        ? lines.map(function(line){ return '<p class="supply-line">' + escapeHtml(line) + '</p>'; }).join('')
        : '';
      html += ''
        + '<section class="course-prep-section section-supply">'
        +   prepTitleHTML(subjectName, '준비물')
        +   '<div class="prep-divider"></div>'
        +   '<div class="prep-supply-text">' + linesHtml + '</div>'
        + '</section>';
    }

    // (C) AI 툴
    if (prep.ai) {
      const items = coursePrepItems(prep.ai);
      const rowsHtml = items.map(function(t) {
        const imgHtml = t.image
          ? '<img class="ai-logo" src="' + escapeAttr(t.image) + '" alt="" '
            + 'onerror="this.style.display=\'none\';">'
          : '';
        const linkOpen  = t.link ? '<a class="ai-link" href="' + escapeAttr(t.link) + '" target="_blank" rel="noopener">' : '';
        const linkClose = t.link ? '</a>' : '';
        const pillText = t.pill || t.text || '';
        const pillHtml = pillText
          ? '<span class="prep-pill prep-pill-small">' + escapeHtml(pillText) + '</span>'
          : '';
        return ''
          + '<div class="ai-row">'
          +   (imgHtml ? (linkOpen + imgHtml + linkClose) : '')
          +   pillHtml
          + '</div>';
      }).join('');
      html += ''
        + '<section class="course-prep-section section-ai">'
        +   prepTitleHTML(subjectName, 'AI 툴')
        +   '<div class="prep-divider"></div>'
        +   '<div class="ai-scroll">' + rowsHtml + '</div>'
        + '</section>';
    }

    return html;
  }
</script>

<script>
  /* ============================================== */
  /*  🎯 강사소개 메인 페이지 생성 (3명씩 페이지 분할)  */
  /* ============================================== */
  
  /**
   * 강사소개 카테고리의 슬라이드들을 생성 (여러 페이지 가능)
   * 반환 형식이 단일 슬라이드가 아닌 배열로 변경됨
   */
  function createInstructorPages(deptName, engHeader, categoryName) {
    // 임시로 첫 페이지 1개만 만들어서 반환하고, 나중에 강사 데이터 받으면 페이지 추가
    const firstSlide = makeInstructorPageShell(deptName, engHeader, 0, 1);
    
    // 강사 데이터 로드 - 끝나면 추가 페이지 생성 + 인디케이터 재구성
    getInstructorListFromSupabase(deptName)
      .then(function(instructors) {
        handleInstructorDataLoaded(deptName, engHeader, instructors || []);
      })
      .catch(function(err) {
        const listEl = firstSlide.querySelector('.instructor-list');
        if (listEl) listEl.innerHTML = '<div style="color:#c00;">오류: ' + (err.message || err) + '</div>';
      });
    
    return [firstSlide];
  }
  
  /* 강사 슬라이드 1개의 외형 만들기 (제목/원/가로선/빈 강사 목록 영역) */
  function makeInstructorPageShell(deptName, engHeader, pageIdx, totalPages) {
    const slide = document.createElement('div');
    slide.className = 'slide-page instructor-page';
    slide.dataset.instructorPage = pageIdx;
    slide.dataset.dept = deptName;

    // 🎯 페이지 번호 - 학과 커리큘럼과 같은 스타일/위치 (좌측 타이틀 아래)
    const badgeHTML = totalPages > 1
      ? '<div class="instructor-page-badge">' + (pageIdx + 1) + ' / ' + totalPages + '</div>'
      : '';
    
      slide.innerHTML = ''
      + '<div class="slide-header">'
      + '<span class="dept-eng">' + escapeHtml(engHeader || '') + '</span>'
      + '<span class="fixed-title">학과 전체 과목 커리큘럼</span>'
      + '</div>'
      + '<div class="main-body">'
      // 🎯 큰 빈 주황 원 (좌측 상단)
      + '<div class="instructor-bg-circle"></div>'
      // 🎯 학과명 (분리)
      + '<div class="instructor-title-dept">' + escapeHtml(deptName) + '</div>'
      // 🎯 "강사 소개" (분리)
      + '<div class="instructor-title-sub">강사 소개</div>'
      // 🎯 가로선 + 주황 점 (분리)
      + '<div class="instructor-line"></div>'
      + '<div class="instructor-dot"></div>'
      // 페이지 번호 (여러 페이지일 때만)
      + badgeHTML
      // 강사 카드 목록
      + '<div class="instructor-list">'
      + (pageIdx === 0 ? '<div style="color:#999;">강사 정보를 불러오는 중...</div>' : '')
      + '</div>'
      + '</div>'
      + '<div class="slide-footer">SBS ACADEMY COMPUTER ART SUWON</div>';

    // 🎯 학과명이 길어도 줄바꿈 없이 폰트 크기 자동 축소 (커리큘럼 페이지와 동일 방식)
    setTimeout(() => {
      const titleEl = slide.querySelector('.instructor-title-dept');
      if (titleEl && typeof fitTitleSize === 'function') fitTitleSize(titleEl);
    }, 0);

    return slide;
  }
  
  /* 강사 데이터 받은 후 처리 - 페이지 추가 + 강사 카드 렌더링 */
  function handleInstructorDataLoaded(deptName, engHeader, instructors) {
    if (typeof activeDeptName !== 'undefined' && activeDeptName !== deptName) {
      return;
    }

    // 전역 저장
    window.currentInstructorsByDept = window.currentInstructorsByDept || {};
    window.currentInstructorsByDept[deptName] = instructors;

    // 이 학과의 첫 강사 페이지(보통 placeholder page=0)를 우선 찾고,
    // 없으면 이 학과의 어느 강사 페이지든 첫 위치를 사용한다.
    // 두 번째 보정 후 이전 응답이 이미 페이지를 교체해버린 경우에도 안전하게 다시 처리하기 위함.
    let firstSlideIdx = slides.findIndex(s =>
      s.classList.contains('instructor-page')
        && s.dataset.instructorPage === '0'
        && s.dataset.dept === deptName
    );
    if (firstSlideIdx < 0) {
      firstSlideIdx = slides.findIndex(s =>
        s.classList.contains('instructor-page') && s.dataset.dept === deptName
      );
    }
    if (firstSlideIdx < 0) return;

    const container = document.getElementById('scale-container');
    const activeSlideBefore = slides[currentSlideIndex] || null;
    const oldInstructorSlides = slides.filter(s =>
      s.classList.contains('instructor-page') && s.dataset.dept === deptName
    );
    const activeWasInstructor = oldInstructorSlides.includes(activeSlideBefore);
    const activeOldPage = activeWasInstructor
      ? Math.max(0, parseInt(activeSlideBefore.dataset.instructorPage || '0', 10) || 0)
      : 0;

    // 기존 강사소개 페이지 구간을 통째로 제거해서 DOM/slides 불일치 방지
    for (let i = slides.length - 1; i >= 0; i--) {
      const s = slides[i];
      if (s.classList.contains('instructor-page') && s.dataset.dept === deptName) {
        if (s.parentNode === container) container.removeChild(s);
        slides.splice(i, 1);
      }
    }

    const newInstructorSlides = [];

    if (instructors.length === 0) {
      const emptySlide = makeInstructorPageShell(deptName, engHeader, 0, 1);
      const listEl = emptySlide.querySelector('.instructor-list');
      if (listEl) listEl.innerHTML = '<div style="color:#999;">등록된 강사가 없습니다.</div>';
      newInstructorSlides.push(emptySlide);
    } else {
      // 🎯 페이지 분할 - 3명까지는 한 페이지, 4명 이상은 2명씩 분할
      const instructorsPerPage = instructors.length > 3 ? 2 : 3;
      const totalPages = Math.max(1, Math.ceil(instructors.length / instructorsPerPage));

      for (let p = 0; p < totalPages; p++) {
        const start = p * instructorsPerPage;
        const pageList = instructors.slice(start, start + instructorsPerPage);
        const pageSlide = makeInstructorPageShell(deptName, engHeader, p, totalPages);
        renderInstructorCards(pageSlide, deptName, pageList, start);
        newInstructorSlides.push(pageSlide);
      }
    }

    const insertAtIdx = Math.min(firstSlideIdx, slides.length);
    const refNode = slides[insertAtIdx] || null;
    newInstructorSlides.forEach(slide => {
      container.insertBefore(slide, refNode);
    });
    slides.splice(insertAtIdx, 0, ...newInstructorSlides);

    if (activeWasInstructor) {
      currentSlideIndex = insertAtIdx + Math.min(activeOldPage, newInstructorSlides.length - 1);
    } else {
      const activeIdx = slides.indexOf(activeSlideBefore);
      currentSlideIndex = activeIdx >= 0 ? activeIdx : Math.min(insertAtIdx, slides.length - 1);
    }

    slides.forEach((slide, idx) => {
      if (idx === currentSlideIndex) slide.classList.add('active');
      else slide.classList.remove('active');
    });
    
    // 인디케이터 + 네비게이션 재구성
    buildIndicator(slides.length);
    updateIndicator();
    updateNavButtons();
  }
  
  /* 한 페이지에 강사 카드 3개 렌더링 */
  function renderInstructorCards(slide, deptName, pageInstructors, startIdx) {
    const listEl = slide.querySelector('.instructor-list');
    if (!listEl) return;

    // 🎯 강사 수에 따른 배치 클래스 적용 (count-1 / count-2 / count-3)
    listEl.classList.remove('count-1', 'count-2', 'count-3');
    const cnt = Math.min(pageInstructors.length, 3);
    if (cnt >= 1) listEl.classList.add('count-' + cnt);

    listEl.innerHTML = pageInstructors.map((inst, i) => {
      const globalIdx = startIdx + i;
      const photoHTML = inst.img
        ? '<img src="' + escapeAttr(inst.img) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'
          + '<span class="no-photo" style="display:none;">사진 없음</span>'
        : '<span class="no-photo">사진 없음</span>';

      return '<div class="instructor-card" data-dept="' + escapeAttr(deptName) + '" data-idx="' + globalIdx + '">'
        + '<div class="instructor-photo-box">'
        + photoHTML
        + '</div>'
        + '<div class="instructor-name">' + escapeHtml(inst.name) + ' 선생님</div>'
        + '<div class="instructor-card-overlay"></div>'
        + '</div>';
    }).join('');
    
    // 카드 이벤트 등록
    listEl.querySelectorAll('.instructor-card').forEach(card => {
      const dept = card.dataset.dept;
      const idx = parseInt(card.dataset.idx, 10);
      const instData = window.currentInstructorsByDept[dept][idx];
      if (!instData) return;
      
      // 클릭 → 강사 상세
      card.addEventListener('click', function() {
        openInstructorLightbox(dept, idx);
      });
      
      // 사진 위에서만 툴팁
      const photoBox = card.querySelector('.instructor-photo-box');
      const overlay = card.querySelector('.instructor-card-overlay');
      
      overlay.addEventListener('mousemove', function(e) {
        const photoRect = photoBox.getBoundingClientRect();
        const inPhotoArea = e.clientX >= photoRect.left
          && e.clientX <= photoRect.right
          && e.clientY >= photoRect.top
          && e.clientY <= photoRect.bottom;
        
        if (inPhotoArea && instData.message) {
          showInstructorTooltip(e, instData.message);
        } else {
          hideInstructorTooltip();
        }
      });
      
      overlay.addEventListener('mouseleave', function() {
        hideInstructorTooltip();
      });
    });
  }
  
  /* ============================================== */
  /*  🎯 한마디 툴팁                                    */
  /* ============================================== */
  
  function showInstructorTooltip(e, message) {
    let tooltip = document.getElementById('instructor-tooltip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.id = 'instructor-tooltip';
      document.body.appendChild(tooltip);
    }
    tooltip.textContent = message;
    
    // 화면 경계 체크
    const tooltipWidth = 300;
    const tooltipHeight = 100;
    let x = e.clientX + 15;
    let y = e.clientY + 15;
    
    if (x + tooltipWidth > window.innerWidth) {
      x = e.clientX - tooltipWidth - 15;
    }
    if (y + tooltipHeight > window.innerHeight) {
      y = e.clientY - tooltipHeight - 15;
    }
    
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
    tooltip.classList.add('visible');
  }
  
  function hideInstructorTooltip() {
    const tooltip = document.getElementById('instructor-tooltip');
    if (tooltip) tooltip.classList.remove('visible');
  }
  
  /* ============================================== */
  /*  🎯 강사 상세 라이트박스                          */
  /* ============================================== */
  
  let currentInstructorContext = null;  // { dept, idx, subjectIdx }
  
  function openInstructorLightbox(deptName, idx) {
    const instructors = window.currentInstructorsByDept[deptName];
    if (!instructors || !instructors[idx]) return;

    hideInstructorTooltip();
    currentInstructorContext = { dept: deptName, idx: idx, subjectIdx: -1 };

    // 🎯 라이트박스에 백드롭/오버레이/우하단 버튼이 없으면 생성 (한 번만)
    ensureInstructorLightboxBackdrop();
    ensureInstructorLightboxButtons();

    renderInstructorDetail();
    const lb = document.getElementById('instructor-lightbox');
    lb.classList.remove('fullscreen');  // 열 때마다 기본 크기로 시작
    lb.classList.add('visible');
    resetInstructorExpandIcon();

    // 🎯 라이트박스 바깥(가이드선 영역) 클릭으로 닫기 + 안쪽 빈 곳 클릭으로 커리큘럼 닫기 핸들러
    initInstructorLightboxOutsideClick();
  }

  /* 🎯 라이트박스 안에 backdrop / dark-overlay 요소가 없으면 만들어서 가장 앞에 삽입
     (HTML 구조 수정 없이 새 디자인에 필요한 레이어를 동적으로 확보) */
  function ensureInstructorLightboxBackdrop() {
    const lb = document.getElementById('instructor-lightbox');
    if (!lb) return;
    if (!lb.querySelector('.instructor-detail-backdrop')) {
      const backdrop = document.createElement('div');
      backdrop.className = 'instructor-detail-backdrop';
      backdrop.id = 'instructor-detail-backdrop';
      lb.insertBefore(backdrop, lb.firstChild);
    }
    if (!lb.querySelector('.instructor-detail-dark-overlay')) {
      const overlay = document.createElement('div');
      overlay.className = 'instructor-detail-dark-overlay';
      const backdrop = lb.querySelector('.instructor-detail-backdrop');
      lb.insertBefore(overlay, backdrop.nextSibling);
    }
  }

  /* 🎯 우하단 확대/닫기 버튼 동적 생성 + 호버 감지 등록 (한 번만) */
  function ensureInstructorLightboxButtons() {
    const lb = document.getElementById('instructor-lightbox');
    if (!lb) return;

    if (!lb.querySelector('.instructor-expand-btn')) {
      const expandBtn = document.createElement('button');
      expandBtn.className = 'instructor-expand-btn';
      expandBtn.id = 'instructor-expand-btn';
      expandBtn.innerHTML =
        '<svg id="instructor-expand-icon" viewBox="0 0 24 24">'
        + '<polyline points="4 9 4 4 9 4"></polyline>'
        + '<polyline points="20 9 20 4 15 4"></polyline>'
        + '<polyline points="4 15 4 20 9 20"></polyline>'
        + '<polyline points="20 15 20 20 15 20"></polyline>'
        + '</svg>'
        + '<svg id="instructor-collapse-icon" viewBox="0 0 24 24" style="display:none;">'
        + '<polyline points="4 14 10 14 10 20"></polyline>'
        + '<polyline points="20 10 14 10 14 4"></polyline>'
        + '<polyline points="14 20 14 14 20 14"></polyline>'
        + '<polyline points="10 4 10 10 4 10"></polyline>'
        + '</svg>';
      expandBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleInstructorFullscreen();
      });
      lb.appendChild(expandBtn);
    }
    if (!lb.querySelector('.instructor-close-btn')) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'instructor-close-btn';
      closeBtn.id = 'instructor-close-btn';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeInstructorLightbox(true);  // 🎯 force=true: 라이트박스 통째로 닫음
      });
      lb.appendChild(closeBtn);
    }

    // 호버 감지 (라이트박스 우하단 모서리)
    if (!lb._hoverDetectionInit) {
      lb._hoverDetectionInit = true;
      const HOVER_CORNER = 220;
      lb.addEventListener('mousemove', function(e) {
        const rect = lb.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const inRightBottom = (x > rect.width - HOVER_CORNER) && (y > rect.height - HOVER_CORNER);
        const expandBtn = lb.querySelector('.instructor-expand-btn');
        const closeBtn = lb.querySelector('.instructor-close-btn');
        if (inRightBottom) {
          expandBtn.classList.add('visible');
          closeBtn.classList.add('visible');
        } else {
          expandBtn.classList.remove('visible');
          closeBtn.classList.remove('visible');
        }
      });
      lb.addEventListener('mouseleave', function() {
        lb.querySelector('.instructor-expand-btn').classList.remove('visible');
        lb.querySelector('.instructor-close-btn').classList.remove('visible');
      });
    }
  }

  /* 🎯 확대/축소 토글 */
  function toggleInstructorFullscreen() {
    const lb = document.getElementById('instructor-lightbox');
    const expandIcon = document.getElementById('instructor-expand-icon');
    const collapseIcon = document.getElementById('instructor-collapse-icon');
    if (lb.classList.contains('fullscreen')) {
      lb.classList.remove('fullscreen');
      expandIcon.style.display = 'block';
      collapseIcon.style.display = 'none';
    } else {
      lb.classList.add('fullscreen');
      expandIcon.style.display = 'none';
      collapseIcon.style.display = 'block';
    }
  }
  function resetInstructorExpandIcon() {
    const expandIcon = document.getElementById('instructor-expand-icon');
    const collapseIcon = document.getElementById('instructor-collapse-icon');
    if (expandIcon) expandIcon.style.display = 'block';
    if (collapseIcon) collapseIcon.style.display = 'none';
  }

  /* 🎯 라이트박스 내부 클릭 → 커리큘럼 팝업이 떠 있고 팝업 박스 바깥을 클릭하면 팝업만 닫기 */
  function initInstructorLightboxOutsideClick() {
    const lb = document.getElementById('instructor-lightbox');
    if (lb._outsideClickInit) return;
    lb._outsideClickInit = true;
    lb.addEventListener('click', function(e) {
      const curriculumLb = document.getElementById('instructor-curriculum-lightbox');
      if (!curriculumLb || !curriculumLb.classList.contains('visible')) return;
      // 과목 버튼 클릭은 제외 (그건 다른 과목으로 전환되는 흐름)
      if (e.target.closest('.subject-btn')) return;
      // 커리큘럼 박스 안쪽 클릭은 제외
      if (e.target.closest('.instructor-curriculum-box')) return;
      // 우하단 확대/닫기 버튼 제외
      if (e.target.closest('.instructor-expand-btn')) return;
      if (e.target.closest('.instructor-close-btn')) return;
      // 그 외 영역 클릭이면 커리큘럼만 닫기
      closeInstructorCurriculum();
    });
  }

  /* 🎯 closeInstructorLightbox
     - 인자 없이 호출 (Curriculum_full의 회색 패널·빈 영역 클릭 핸들러 등): 라이트박스 전체를 닫지 않고,
       커리큘럼이 떠있을 때만 그것만 닫음. (회색 영역 클릭으로 라이트박스 통째로 닫는 효과 제거)
     - force=true로 호출 (우하단 X 버튼 등 명시적 닫기): 라이트박스 통째로 닫음 */
  function closeInstructorLightbox(force) {
    if (!force) {
      // 🎯 명시적 닫기가 아니면: 라이트박스는 유지하고 커리큘럼만 닫음
      const curriculumLb = document.getElementById('instructor-curriculum-lightbox');
      if (curriculumLb && curriculumLb.classList.contains('visible')) {
        closeInstructorCurriculum();
      }
      return;
    }
    // 🎯 force = 라이트박스 통째로 닫는 동작 (X 버튼 전용)
    const lb = document.getElementById('instructor-lightbox');
    lb.classList.remove('visible');
    lb.classList.remove('fullscreen');
    closeInstructorCurriculum();
    hideInstructorTooltip();
    currentInstructorContext = null;
  }

  function renderInstructorDetail() {
    if (!currentInstructorContext) return;
    const { dept, idx } = currentInstructorContext;
    const inst = window.currentInstructorsByDept[dept][idx];
    if (!inst) return;

    // 🎯 백드롭에 강사 사진을 블러로 깔기
    const backdropEl = document.getElementById('instructor-detail-backdrop');
    if (backdropEl) {
      backdropEl.style.backgroundImage = inst.img ? 'url("' + inst.img + '")' : 'none';
    }

    // 사진 (라이트박스 중앙~우측의 큰 컬러 사진)
    const photoEl = document.getElementById('instructor-detail-photo');
    photoEl.innerHTML = '';
    if (inst.img) {
      const img = document.createElement('img');
      img.src = inst.img;
      img.onerror = function() {
        photoEl.innerHTML = '<div class="no-photo">사진 없음</div>';
      };
      photoEl.appendChild(img);
    } else {
      photoEl.innerHTML = '<div class="no-photo">사진 없음</div>';
    }

    // 🎯 큰 강사 사진에 호버하면 메인 페이지처럼 한마디 툴팁 표시
    photoEl.onmousemove = function(e) {
      if (inst.message) showInstructorTooltip(e, inst.message);
    };
    photoEl.onmouseleave = function() {
      hideInstructorTooltip();
    };

    // 🎯 강사명 + "선생님" (피그마: "김민주 선생님" 형태)
    document.getElementById('instructor-detail-name').textContent = inst.name + ' 선생님';
    document.getElementById('instructor-detail-career').textContent = inst.career || '';
    
    // 과목 버튼들
    const subjectsEl = document.getElementById('instructor-subjects');
    if (inst.subjects && inst.subjects.length > 0) {
      subjectsEl.innerHTML = inst.subjects.map((subj, sIdx) => {
        return '<button class="subject-btn" data-subject-idx="' + sIdx + '">'
          + escapeHtml(subj) + '</button>';
      }).join('');
      
      // 과목 버튼 클릭 이벤트
      subjectsEl.querySelectorAll('.subject-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const sIdx = parseInt(this.dataset.subjectIdx, 10);
          selectSubject(sIdx);
        });
      });
    } else {
      subjectsEl.innerHTML = '<div style="color:rgba(255,255,255,0.7); font-size: 16px;">등록된 과목이 없습니다.</div>';
    }
  }
  
  function selectSubject(sIdx) {
    if (!currentInstructorContext) return;
    const { dept, idx } = currentInstructorContext;
    const inst = window.currentInstructorsByDept[dept][idx];
    if (!inst || !inst.subjects[sIdx]) return;
    
    currentInstructorContext.subjectIdx = sIdx;
    
    // 버튼 active 상태 업데이트
    document.querySelectorAll('#instructor-subjects .subject-btn').forEach((b, i) => {
      if (i === sIdx) b.classList.add('active');
      else b.classList.remove('active');
    });
    
    // 커리큘럼 라이트박스 열기
    openInstructorCurriculum(dept, inst.name, inst.subjects[sIdx]);
  }
  
  /* ============================================== */
  /*  🎯 강사 커리큘럼 라이트박스 (흰 박스)            */
  /* ============================================== */
  
  function openInstructorCurriculum(deptName, instructorName, subjectName) {
    const lb = document.getElementById('instructor-curriculum-lightbox');
    const box = document.getElementById('instructor-curriculum-box-content');

    box.innerHTML = '<div class="curriculum-box-empty">커리큘럼을 불러오는 중...</div>';
    lb.classList.add('visible');
    // 🎯 ESC 우선순위용 글로벌 플래그
    //   visible 클래스 체크가 타이밍/상속 문제로 false가 되는 케이스를 대비해
    //   명시적인 boolean 상태를 함께 둔다. ESC 핸들러는 이 플래그를 먼저 본다.
    window._instructorCurriculumOpen = true;

    // 🎯 강사 라이트박스에 curriculum-open 클래스 → 강사 사진 블러 처리
    document.getElementById('instructor-lightbox').classList.add('curriculum-open');

    getInstructorCurriculumFromSupabase(deptName, instructorName, subjectName)
      .then(function(data) {
        renderInstructorCurriculum(data);
      })
      .catch(function(err) {
        box.innerHTML = '<div class="curriculum-box-empty" style="color:#c00;">오류: ' + (err.message || err) + '</div>';
      });
  }

  function closeInstructorCurriculum() {
    document.getElementById('instructor-curriculum-lightbox').classList.remove('visible');
    // 🎯 ESC 우선순위 플래그 해제
    window._instructorCurriculumOpen = false;

    // 🎯 강사 사진 블러 해제
    document.getElementById('instructor-lightbox').classList.remove('curriculum-open');

    // 모든 과목 버튼 active 해제
    document.querySelectorAll('#instructor-subjects .subject-btn').forEach(b => {
      b.classList.remove('active');
    });
    if (currentInstructorContext) currentInstructorContext.subjectIdx = -1;
  }
  
  function renderInstructorCurriculum(data) {
    const box = document.getElementById('instructor-curriculum-box-content');

    if (data.error) {
      box.innerHTML = '<div class="curriculum-box-empty" style="color:#c00;">' + escapeHtml(data.error) + '</div>';
      return;
    }

    const weeks = data.weeks || [];
    if (weeks.length === 0) {
      box.innerHTML = '<div class="curriculum-box-empty">등록된 커리큘럼이 없습니다.</div>';
      return;
    }

    // 🎯 현재 보고 있는 (dept, instructor, subject) 컨텍스트 캡처 (카드 클릭 시 사용)
    const ctx = currentInstructorContext || {};
    const inst = (ctx.dept && window.currentInstructorsByDept && window.currentInstructorsByDept[ctx.dept])
      ? window.currentInstructorsByDept[ctx.dept][ctx.idx] : null;
    const dept = ctx.dept || '';
    const instructorName = inst ? inst.name : '';
    const subjectName = (inst && ctx.subjectIdx >= 0 && inst.subjects) ? inst.subjects[ctx.subjectIdx] : '';

    // 🎯 최대 4개까지 표시 (4개 이상이어도 일단 첫 4개만 - 향후 페이지 분할 가능)
    const display = weeks.slice(0, 4);
    const cnt = display.length;
    const countClass = ' cols-' + Math.min(cnt, 3);

    let html = '<div class="instructor-curriculum-weeks' + (cnt < 4 ? countClass : '') + '">';
    display.forEach(week => {
      const mediaHTML = week.img
        ? '<img src="' + escapeAttr(week.img) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'
          + '<span class="no-img-text" style="display:none;">이미지 없음</span>'
        : '<span class="no-img-text">이미지 없음</span>';

      // 🎯 카드 이미지 박스에 data 속성 추가 (클릭 시 큰 라이트박스용 키)
      html += '<div class="week-card-mini">'
        + '<div class="img-box-mini" '
        +    'data-dept="' + escapeAttr(dept) + '" '
        +    'data-instructor="' + escapeAttr(instructorName) + '" '
        +    'data-subject="' + escapeAttr(subjectName) + '" '
        +    'data-week="' + escapeAttr(week.title) + '">'
        + mediaHTML + '</div>'
        + '<div class="week-label">' + escapeHtml(week.title) + '</div>'
        + '<div class="week-divider"></div>'
        + '<div class="week-content">' + escapeHtml(week.content) + '</div>'
        + '</div>';
    });
    for (let i = cnt; i < 4; i++) {
      html += '<div class="week-card-mini"></div>';
    }
    html += '</div>';

    box.innerHTML = html;

    if (dept && instructorName) {
      loadInstructorFlatWeeks(dept, instructorName);
    }

    // 🎯 카드 클릭 → 큰 라이트박스 (강사의 모든 과목·주차 평탄화 데이터 기반)
    box.querySelectorAll('.img-box-mini[data-week]').forEach(card => {
      card.addEventListener('click', function(e) {
        e.stopPropagation();
        const d = this.dataset.dept;
        const inst = this.dataset.instructor;
        const subj = this.dataset.subject;
        const wk = this.dataset.week;
        if (!d || !inst || !subj || !wk) return;
        openInstructorWeekLightbox(d, inst, subj, wk);
      });
    });
  }

  /* ============================================== */
  /*  🎯 강사 라이트박스 → 카드 클릭 시 큰 라이트박스
       (Curriculum_full의 #lightbox-overlay를 재사용)             */
  /* ============================================== */

  // 강사별로 평탄화 데이터를 캐싱 (dept|instructor 키)
  window.instructorFlatWeeksCache = window.instructorFlatWeeksCache || {};
  window.instructorFlatWeeksPending = window.instructorFlatWeeksPending || {};

  function preloadInstructorWeekImages(items) {
    if (!items || !items.length) return;
    items.forEach(function(item) {
      const src = item && item.week && item.week.img;
      if (!src) return;
      const img = new Image();
      img.src = src;
    });
  }

  function loadInstructorFlatWeeks(deptName, instructorName, onSuccess, onFailure) {
    const key = deptName + '|' + instructorName;
    const cached = window.instructorFlatWeeksCache[key];

    if (cached) {
      if (typeof onSuccess === 'function') onSuccess(cached);
      return;
    }

    if (window.instructorFlatWeeksPending[key]) {
      if (typeof onSuccess === 'function') {
        window.instructorFlatWeeksPending[key].push(onSuccess);
      }
      return;
    }

    window.instructorFlatWeeksPending[key] = typeof onSuccess === 'function' ? [onSuccess] : [];

    getAllInstructorCurriculumFromSupabase(deptName, instructorName)
      .then(function(data) {
        const items = (data && data.items) || [];
        window.instructorFlatWeeksCache[key] = items;
        preloadInstructorWeekImages(items);

        const callbacks = window.instructorFlatWeeksPending[key] || [];
        delete window.instructorFlatWeeksPending[key];
        callbacks.forEach(function(cb) {
          if (typeof cb === 'function') cb(items);
        });
      })
      .catch(function(err) {
        const callbacks = window.instructorFlatWeeksPending[key] || [];
        delete window.instructorFlatWeeksPending[key];
        console.warn('[InstructorWeekLightbox] 데이터 로드 실패:', err && err.message);
        if (typeof onFailure === 'function') onFailure(err);
        callbacks.forEach(function(cb) {
          if (typeof cb === 'function') cb([]);
        });
      });
  }

  function openInstructorWeekLightbox(deptName, instructorName, subjectName, weekTitle) {
    loadInstructorFlatWeeks(deptName, instructorName, function(items) {
        _showInstructorWeekLightbox(items, subjectName, weekTitle);
    });
  }

  function _showInstructorWeekLightbox(items, subjectName, weekTitle) {
    if (!items || items.length === 0) return;
    // 현재 클릭한 (subject, week) 인덱스 찾기
    const idx = items.findIndex(function(it) {
      return it.subjectName === subjectName && it.week.title === weekTitle;
    });
    if (idx < 0) return;

    // 🎯 학과 페이지에서 사용 중인 flatWeeksForLightbox 백업 + 강사용으로 덮어씀
    if (window._flatWeeksBackupForInstructor === undefined) {
      window._flatWeeksBackupForInstructor = window.flatWeeksForLightbox || null;
    }
    window.flatWeeksForLightbox = items;

    // 🎯 Curriculum_full의 기존 함수 호출 (동일한 디자인/효과)
    if (typeof openLightbox === 'function') {
      openLightbox(idx);
    }
  }

  // 🎯 백업 복원은 Curriculum_full의 closeLightbox 내부에서 직접 처리 (한 줄 추가)
  //    여기서 함수 wrap을 하지 않는 이유: 함수 선언 재할당이 strict 모드에서 문제될 수 있음
</script>

  <!-- ============================================== -->
<!--  🎯 학과별 채용정보 카테고리 페이지                -->
<!--   - 피그마 디자인 (node-id 183:643)              -->
<!--   - 시트 1nADj2xWB... 학과별 탭에서 데이터 로드   -->
<!--   - 5컬럼 테이블 (회사명/업무내용/자격요건/근무형태/급여) -->
<!--   - 행 50px 간격, 한 페이지 초과 시 1/N, 2/N 분할 -->
<!-- ============================================== -->

<style>
  /* ============================================== */
  /*  채용정보 페이지 - 1920×1080 슬라이드 기준         */
  /* ============================================== */
  .recruitment-page .main-body {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* 🎯 좌측 주황 원형 */
  .recruitment-bg-circle {
    position: absolute;
    width: 137px;
    height: 137px;
    border-radius: 50%;
    background: var(--accent-orange);
    left: 0;
    top: 0;

<script>
  /* ============================================== */
  /*  🎯 채용정보 카테고리 페이지 생성 (여러 페이지 가능) */
  /*    한 페이지당 최대 ROWS_PER_PAGE 행                */
  /*    데이터 로드 후 페이지 수 결정 → 슬라이드 추가 갱신 */
  /* ============================================== */

  /**
   * 채용정보 카테고리의 슬라이드들을 생성 (여러 페이지 가능)
   * @returns {Array<HTMLElement>} 초기 슬라이드 배열 (1장만 반환, 데이터 로드 후 추가됨)
   */
  function createRecruitmentPages(deptName, engHeader) {
    // 학과명 짧은 형식 (예: "시각편집학과" → "시각편집")
    const deptShort = String(deptName || '').replace(/학과$/, '').trim();

    // 임시로 첫 페이지 1개만 만들어서 반환
    const firstSlide = makeRecruitmentPageShell(deptShort, engHeader, 0, 1);

    // 데이터 로드
    getRecruitmentListFromSupabase(deptName)
      .then(function(list) {
        handleRecruitmentDataLoaded(deptName, deptShort, engHeader, list || []);
      })
      .catch(function(err) {
        const body = firstSlide.querySelector('.main-body');
        if (body) {
          const errEl = document.createElement('div');
          errEl.className = 'recruitment-empty';
          errEl.style.color = '#c00';
          errEl.textContent = '오류: ' + (err && err.message ? err.message : err);
          body.appendChild(errEl);
        }
      });

    return [firstSlide];
  }

  /* 채용정보 슬라이드 1장 외형 생성 (헤더/푸터/타이틀/표 헤더/구분선) */
  function makeRecruitmentPageShell(deptShort, engHeader, pageIdx, totalPages) {
    const slide = document.createElement('div');
    slide.className = 'slide-page recruitment-page';
    slide.dataset.recruitmentPage = pageIdx;

    const badgeHTML = totalPages > 1
      ? '<div class="recruitment-page-badge">' + (pageIdx + 1) + ' / ' + totalPages + '</div>'
      : '';

    slide.innerHTML = ''
      + '<div class="slide-header">'
      + '<span class="dept-eng">' + escapeHtml(engHeader || '') + '</span>'
      + '<span class="fixed-title">RECRUITMENT</span>'
      + '</div>'
      + '<div class="main-body">'
      // 좌측 주황 원 + 학과명/채용정보
      + '<div class="recruitment-bg-circle"></div>'
      + '<div class="recruitment-title-dept">' + escapeHtml(deptShort) + '</div>'
      + '<div class="recruitment-title-sub">채용정보</div>'
      + badgeHTML
      // 표 헤더 (5컬럼) - 각 헤더는 col-* 클래스로 좌표/너비 지정
      + '<div class="recruitment-col-header col-company">회사명</div>'
      + '<div class="recruitment-col-header col-worktype">업무내용</div>'
      + '<div class="recruitment-col-header col-qualification">자격요건</div>'
      + '<div class="recruitment-col-header col-workform">근무형태</div>'
      + '<div class="recruitment-col-header col-salary">급여</div>'
      // 주황 구분선 (각 컬럼별)
      + '<div class="recruitment-divider col-company"></div>'
      + '<div class="recruitment-divider col-worktype"></div>'
      + '<div class="recruitment-divider col-qualification"></div>'
      + '<div class="recruitment-divider col-workform"></div>'
      + '<div class="recruitment-divider col-salary"></div>'
      // 🎯 채용 상세 팝업 (초기 숨김, 행 클릭 시 visible)
      + '<div class="recruitment-popup-overlay" data-popup>'
      +   '<div class="recruitment-popup-box">'
      +     '<button class="recruitment-popup-close" type="button" title="닫기">×</button>'
      +     '<div class="recruitment-popup-label row-company">회사명</div>'
      +     '<div class="recruitment-popup-value row-company" data-field="company"></div>'
      +     '<div class="recruitment-popup-label row-worktype">업무내용</div>'
      +     '<div class="recruitment-popup-value row-worktype" data-field="workType"></div>'
      +     '<div class="recruitment-popup-label row-qualification">자격요건</div>'
      +     '<div class="recruitment-popup-value row-qualification" data-field="qualification"></div>'
      +     '<div class="recruitment-popup-label row-workform">근무형태</div>'
      +     '<div class="recruitment-popup-value row-workform" data-field="workForm"></div>'
      +     '<div class="recruitment-popup-label row-salary">급여</div>'
      +     '<div class="recruitment-popup-value row-salary" data-field="salary"></div>'
      +   '</div>'
      + '</div>'
      + '</div>'
      + '<div class="slide-footer">SBS ACADEMY COMPUTER ART SUWON</div>';

    return slide;
  }

  /* 데이터 로드 완료 후 처리 - 페이지 분할 + 행 렌더링 */
  function handleRecruitmentDataLoaded(deptName, deptShort, engHeader, items) {
    if (!items || items.length === 0) {
      // 빈 경우 - 첫 슬라이드에 메시지 표시
      const firstSlide = document.querySelector(
        '.slide-page.recruitment-page[data-recruitment-page="0"]'
      );
      if (firstSlide) {
        const body = firstSlide.querySelector('.main-body');
        if (body) {
          const empty = document.createElement('div');
          empty.className = 'recruitment-empty';
          empty.textContent = '등록된 채용정보가 없습니다.';
          body.appendChild(empty);
        }
      }
      return;
    }

    // 페이지 분할 - 한 페이지 최대 ROWS_PER_PAGE 행
    const ROWS_PER_PAGE = 10;            // 50px × 10행
    const ROW_START_TOP = 178;
    const ROW_HEIGHT    = 50;
    window._recruitmentItems = items;

    const totalPages = Math.max(1, Math.ceil(items.length / ROWS_PER_PAGE));

    // 첫 페이지 위치 찾기
    const firstSlideIdx = slides.findIndex(function(s) {
      return s.classList.contains('recruitment-page')
        && s.dataset.recruitmentPage === '0';
    });
    if (firstSlideIdx < 0) return;

    const container = document.getElementById('scale-container');
    const oldFirst = slides[firstSlideIdx];

    // 첫 페이지 재생성 (페이지 번호 포함)
    const newFirst = makeRecruitmentPageShell(deptShort, engHeader, 0, totalPages);
    if (oldFirst.classList.contains('active')) {
      newFirst.classList.add('active');
    }
    container.replaceChild(newFirst, oldFirst);
    slides[firstSlideIdx] = newFirst;

    // 첫 페이지 행 렌더링
    renderRecruitmentRows(newFirst, items.slice(0, ROWS_PER_PAGE), ROW_START_TOP, ROW_HEIGHT, 0);

    // 추가 페이지 생성
    for (let p = 1; p < totalPages; p++) {
      const extra = makeRecruitmentPageShell(deptShort, engHeader, p, totalPages);
      const insertAtIdx = firstSlideIdx + p;
      const refNode = slides[insertAtIdx] || null;
      container.insertBefore(extra, refNode);
      slides.splice(insertAtIdx, 0, extra);

      const start = p * ROWS_PER_PAGE;
      const end = start + ROWS_PER_PAGE;
      renderRecruitmentRows(extra, items.slice(start, end), ROW_START_TOP, ROW_HEIGHT, start);
    }

    // 인디케이터 / 네비게이션 재구성
    buildIndicator(slides.length);
    updateIndicator();
    updateNavButtons();
  }

  /* 한 페이지에 채용 행들 렌더링 (각 행은 wrapper로 묶어 hover/click 처리) */
  function renderRecruitmentRows(slide, pageItems, startTop, rowHeight, globalOffset) {
    const body = slide.querySelector('.main-body');
    if (!body) return;

    // 팝업이 main-body의 자식이라 행은 그 앞에 삽입 (z-index도 충분히 분리됨)
    const popup = body.querySelector('.recruitment-popup-overlay');

    pageItems.forEach(function(it, i) {
      const top = startTop + i * rowHeight;

      // 행 wrapper (1920×50, hover/click 대상)
      const row = document.createElement('div');
      row.className = 'recruitment-row';
      row.style.top = top + 'px';
      row.style.height = rowHeight + 'px';

      // 5개 컬럼 셀 생성 (col-* 클래스로 좌표/너비 동일하게)
      const cellSpecs = [
        { cls: 'col-company',       val: it.company },
        { cls: 'col-worktype',      val: it.workType },
        { cls: 'col-qualification', val: it.qualification },
        { cls: 'col-workform',      val: it.workForm },
        { cls: 'col-salary',        val: it.salary }
      ];
      cellSpecs.forEach(function(spec) {
        const cell = document.createElement('div');
        cell.className = 'recruitment-cell ' + spec.cls;
        cell.textContent = spec.val || '';
        row.appendChild(cell);
      });

      // 행 클릭 시 팝업 열기 - 이 슬라이드의 팝업에 값 채우고 표시
      row.addEventListener('click', function() {
        openRecruitmentPopup(slide, it, (globalOffset || 0) + i);
      });

      if (popup) body.insertBefore(row, popup);
      else body.appendChild(row);
    });
  }

  /* ============================================== */
  /*  🎯 채용 상세 팝업 열기 / 닫기                     */
  /* ============================================== */

  function ensureRecruitmentPopup() {
    let popup = document.getElementById('recruitment-global-popup');
    if (popup) return popup;

    popup = document.createElement('div');
    popup.id = 'recruitment-global-popup';
    popup.className = 'recruitment-popup-overlay';
    popup.innerHTML = ''
      + '<div class="recruitment-popup-box" role="dialog" aria-modal="true">'
      +   '<button class="recruitment-popup-close" type="button" title="닫기">×</button>'
      +   '<div class="recruitment-popup-content">'
      +     '<div class="recruitment-popup-label">회사명</div>'
      +     '<div class="recruitment-popup-value" data-field="company"></div>'
      +     '<div class="recruitment-popup-label">업무내용</div>'
      +     '<div class="recruitment-popup-value" data-field="workType"></div>'
      +     '<div class="recruitment-popup-label">자격요건</div>'
      +     '<div class="recruitment-popup-value" data-field="qualification"></div>'
      +     '<div class="recruitment-popup-label">근무형태</div>'
      +     '<div class="recruitment-popup-value" data-field="workForm"></div>'
      +     '<div class="recruitment-popup-label">급여</div>'
      +     '<div class="recruitment-popup-value" data-field="salary"></div>'
      +   '</div>'
      + '</div>';
    popup.innerHTML = ''
      + '<div class="recruitment-popup-box" role="dialog" aria-modal="true">'
      +   '<button class="recruitment-popup-close" type="button" title="닫기">×</button>'
      +   '<div class="recruitment-popup-content">'
      +     '<div class="recruitment-popup-label">회사명</div>'
      +     '<div class="recruitment-popup-value recruitment-popup-company" data-field="company"></div>'
      +     '<div class="recruitment-popup-label">업무내용</div>'
      +     '<div class="recruitment-popup-value" data-field="workType"></div>'
      +     '<div class="recruitment-popup-label">자격요건</div>'
      +     '<div class="recruitment-popup-value" data-field="qualification"></div>'
      +     '<div class="recruitment-popup-label">근무형태</div>'
      +     '<div class="recruitment-popup-value" data-field="workForm"></div>'
      +     '<div class="recruitment-popup-label">급여</div>'
      +     '<div class="recruitment-popup-value" data-field="salary"></div>'
      +   '</div>'
      + '</div>';
    document.body.appendChild(popup);
    return popup;
  }

  function openRecruitmentPopup(slide, item, index) {
    const popup = ensureRecruitmentPopup();
    window._activeRecruitmentPopup = popup;
    window._activeRecruitmentIndex = typeof index === 'number' ? index : 0;
    renderRecruitmentPopupItem(item || (window._recruitmentItems || [])[window._activeRecruitmentIndex]);
    popup.classList.add('visible');
  }

  function renderRecruitmentPopupItem(item) {
    const popup = ensureRecruitmentPopup();
    popup.querySelectorAll('.recruitment-popup-value').forEach(function(el) {
      const field = el.dataset.field;
      el.textContent = (item && item[field]) ? item[field] : '';
    });
  }

  function moveRecruitmentPopup(delta) {
    const items = window._recruitmentItems || [];
    if (!items.length) return;

    let next = (typeof window._activeRecruitmentIndex === 'number')
      ? window._activeRecruitmentIndex + delta
      : 0;
    next = Math.max(0, Math.min(items.length - 1, next));
    if (next === window._activeRecruitmentIndex) return;

    window._activeRecruitmentIndex = next;
    renderRecruitmentPopupItem(items[next]);
  }

  function closeRecruitmentPopup(popup) {
    if (!popup) popup = window._activeRecruitmentPopup;
    if (!popup) return;
    popup.classList.remove('visible');
    if (window._activeRecruitmentPopup === popup) {
      window._activeRecruitmentPopup = null;
      window._activeRecruitmentIndex = -1;
    }
  }

  /* 팝업 닫기/이동 이벤트 - 한 번만 등록 */
  (function ensureRecruitmentPopupHandlers() {
    if (window._recruitmentPopupHandlersInit) return;
    window._recruitmentPopupHandlersInit = true;

    document.addEventListener('click', function(e) {
      if (e.target.closest('.recruitment-popup-close')) {
        closeRecruitmentPopup(e.target.closest('.recruitment-popup-overlay'));
        return;
      }

      const overlay = e.target.closest('.recruitment-popup-overlay');
      if (overlay && overlay.classList.contains('visible')) {
        if (e.target.closest('.recruitment-popup-box')) return;
        closeRecruitmentPopup(overlay);
      }
    });

    let popupWheelLocked = false;
    window.addEventListener('wheel', function(e) {
      const popup = window._activeRecruitmentPopup;
      if (!popup || !popup.classList.contains('visible')) return;

      e.preventDefault();
      e.stopPropagation();
      if (popupWheelLocked) return;
      popupWheelLocked = true;
      moveRecruitmentPopup(e.deltaY > 0 ? 1 : -1);
      setTimeout(function() { popupWheelLocked = false; }, 180);
    }, { capture: true, passive: false });

    window.addEventListener('keydown', function(e) {
      const popup = window._activeRecruitmentPopup;
      if (!popup || !popup.classList.contains('visible')) return;

      if (e.key === 'Escape') {
        closeRecruitmentPopup(popup);
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        moveRecruitmentPopup(1);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        moveRecruitmentPopup(-1);
      } else {
        return;
      }

      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
    }, true);
  })();
</script>
