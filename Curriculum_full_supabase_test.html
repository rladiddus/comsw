<script>
  /* ============================================== */
  /*  🎯 취업 프로세스 슬라이드 1장 생성                */
  /*    5개 STEP 카드 하드코딩 (학과 무관 공통)         */
  /* ============================================== */

  /**
   * 5개 STEP 데이터 (피그마 디자인 그대로)
   * 학과와 무관하게 모든 학과에서 동일하게 사용.
   */
  const EMPLOYMENT_STEPS = [
    {
      title: '취업 희망기업 서칭 및 목표수립',
      lines: [
        '구인 사이트 등록 및 활용방법 교육',
        '회사 리스트업',
        '목표회사 설정',
        '기업&직무 분석',
        '기업 분석 및 취업전략 수립'
      ]
    },
    {
      title: '이력서, 자소서 특강 및 작성',
      lines: [
        '이력서, 자기소개서 특강',
        '잘된 이력서 / 잘못된 이력서 분석',
        '디자인 이력서 예시 체크',
        '개별 이력서, 자기소개서 1:1 첨삭',
        '개별 스케쥴 조율'
      ]
    },
    {
      title: '취업 이벤트',
      lines: [
        '실무자 세미나',
        '실무이야기',
        '기업체 견학 or 전시회 참관',
        '면접 준비 특강'
      ]
    },
    {
      title: '최종 점검',
      lines: [
        '이력서, 자기소개서,',
        '포트폴리오 완성도 체크'
      ]
    },
    {
      title: '사후 관리',
      lines: [
        '실전 대비 모의 면접 실시',
        '1 대 1 피드백',
        '사후 관리'
      ]
    }
  ];

  /* 활성 카드가 화면 중앙(약 X=960)에 오도록 track의 translateX 계산 */
  function computeEmploymentTrackOffset(idx) {
    // 카드 너비 418, 카드끼리 약 80px 겹침 → 시작 간격 338
    // 활성 카드 가운데 X = idx * 338 + 209 (트랙 내부 좌표)
    // 화면 가운데 X = 960
    // translateX = 960 - (idx * 338 + 209) = 751 - idx * 338
    return 751 - idx * 338;
  }

  /**
   * 취업 프로세스 페이지 1장 생성
   * @param {string} deptName    학과명 (좌측 타이틀에는 미사용, 우상단 영문 헤더용)
   * @param {string} engHeader   학과 영문 헤더 (예: VISUAL EDITING)
   * @returns {HTMLElement} 슬라이드 요소
   */
  function createEmploymentPage(deptName, engHeader) {
    const slide = document.createElement('div');
    slide.className = 'slide-page employment-page';
    slide.dataset.category = '취업프로세스';

    // 카드 HTML 생성
    let cardsHtml = '';
    EMPLOYMENT_STEPS.forEach(function(step, i) {
      const linesHtml = step.lines.map(function(line) {
        return '<span class="line">' + escapeHtml(line) + '</span>';
      }).join('');
      cardsHtml += ''
        + '<div class="employment-card" data-step="' + i + '">'
        +   '<div class="employment-card-header">' + escapeHtml(step.title) + '</div>'
        +   '<div class="employment-card-body">' + linesHtml + '</div>'
        + '</div>';
    });

    // STEP 네비게이션 (5개)
    let navHtml = '';
    for (let i = 0; i < 5; i++) {
      navHtml += ''
        + '<div class="step-nav-item" data-step="' + i + '">'
        +   '<span class="step-nav-label">STEP ' + (i + 1) + '</span>'
        +   '<span class="step-nav-dot"></span>'
        + '</div>';
    }

    slide.innerHTML = ''
      + '<div class="slide-header">'
      + '<span class="dept-eng">' + escapeHtml(engHeader || '') + '</span>'
      + '<span class="fixed-title">RECRUITMENT PROCESS</span>'
      + '</div>'
      + '<div class="main-body">'
      // 좌측 주황 원 + "취업 프로세스" 타이틀 한 줄
      + '<div class="employment-bg-circle"></div>'
      + '<div class="employment-title">취업 프로세스</div>'
      // 중앙 STEP 네비게이션
      + '<div class="step-nav-line"></div>'
      + navHtml
      // 카드 캐러셀
      + '<div class="employment-cards-wrapper">'
      +   '<div class="employment-cards-track">'
      +     cardsHtml
      +   '</div>'
      + '</div>'
      + '</div>'
      + '<div class="slide-footer">SBS ACADEMY COMPUTER ART SUWON</div>';

    // 초기 활성 STEP = 0
    setTimeout(function() {
      setActiveEmploymentStep(slide, 0);
    }, 0);

    // STEP 네비 hover/click → 해당 STEP 활성화
    slide.querySelectorAll('.step-nav-item').forEach(function(item) {
      const idx = parseInt(item.dataset.step, 10);
      // 마우스 호버
      item.addEventListener('mouseenter', function() {
        setActiveEmploymentStep(slide, idx);
      });
      // 클릭도 가능
      item.addEventListener('click', function() {
        setActiveEmploymentStep(slide, idx);
      });
    });

    // 카드 자체 클릭으로도 활성화 (혹시 카드 위에서 마우스 호버 시)
    slide.querySelectorAll('.employment-card').forEach(function(card) {
      const idx = parseInt(card.dataset.step, 10);
      card.addEventListener('click', function() {
        setActiveEmploymentStep(slide, idx);
      });
    });

    return slide;
  }

  /* 활성 STEP 변경 */
  function setActiveEmploymentStep(slide, idx) {
    if (!slide) return;
    idx = Math.max(0, Math.min(4, idx | 0));

    // STEP 네비 active 토글
    slide.querySelectorAll('.step-nav-item').forEach(function(item, i) {
      if (i === idx) item.classList.add('active');
      else item.classList.remove('active');
    });

    // 카드 active 토글
    slide.querySelectorAll('.employment-card').forEach(function(card, i) {
      if (i === idx) card.classList.add('active');
      else card.classList.remove('active');
    });

    // 트랙 translateX (활성 카드를 화면 가운데로)
    const track = slide.querySelector('.employment-cards-track');
    if (track) {
      track.style.transform = 'translateX(' + computeEmploymentTrackOffset(idx) + 'px)';
    }
  }
</script>

<!-- 🎯 썸네일 라이트박스 (커리큘럼 이미지 확대) -->
  <div id="lightbox-overlay">

  <!-- 🎯 강사 상세 라이트박스 -->
    <div id="instructor-lightbox">
      <!-- 우측 1/3 반투명 패널 -->

      <!-- 강사 사진 (좌측, 크게) -->

      <!-- 우측 - 과목 버튼들 -->
      <div class="instructor-subjects" id="instructor-subjects"></div>
    </div>
    
    <!-- 🎯 강사 커리큘럼 라이트박스 (2단계, 흰 박스) -->
    <div id="instructor-curriculum-lightbox">
      <div class="instructor-curriculum-box" id="instructor-curriculum-box-content">
        <!-- 동적으로 채워짐 -->
      </div>
    </div>

  <script>
    const LOADING_CACHE_KEY = 'loading_image_cache_v1';
    const LOADING_LIST_CACHE_KEY = 'loading_list_cache_v1';
    
    let cachedWebAppUrl = null;
    let isNavigating = false;
    let isLoadingContentDisplayed = false;
    let dataReady = false;
    let loadingContentReady = false;
    let webAppUrlReady = false;
    let domReady = false;
    const MIN_LOADING_TIME = 2500;
    const MAX_LOADING_TIME = 8000;
    const loadingStartTime = Date.now();
    const loadingProgressSteps = {
      dom: 10,
      loadingContent: 20,
      data: 55,
      webAppUrl: 15
    };
    const loadingProgressDone = {};
    
    let departmentsData = [];
    let activeDeptName = null;
    let isFullscreen = false;
    
    let slides = [];
    let currentSlideIndex = 0;
    let supabaseSheetCache = {};

    /*
     * Supabase 테스트 설정
     * - 브라우저 공개용 파일이므로 service_role 키를 절대 넣지 않는다.
     * - 이 키는 읽기 전용 RLS 정책용 anon/public key다.
     */
    const SUPABASE_URL = window.COMSW_SUPABASE_CONFIG.url;
    const SUPABASE_ANON_KEY = window.COMSW_SUPABASE_CONFIG.anonKey;
    const SUPABASE_RAW_TABLE = window.COMSW_SUPABASE_CONFIG.rawTable;
    const CURRICULUM_SHEET_NAME = '컴수원_전체수업';
    const COURSE_PREP_SHEET_NAMES = [
      '수업별 준비물(AI/교재 등)',
      '수업별 준비몰(AI/교재 등)'
    ];
    const INSTRUCTOR_SHEET_NAME = '강사페이지';

    function normalizeText(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/[\u200B\u200C\u200D\uFEFF\u00A0]/g, '').trim();
    }

    function truthyCell(v) {
      if (v === true) return true;
      const s = normalizeText(v).toLowerCase();
      return s === 'true' || s === 'y' || s === 'yes' || s === '1' || s === 'checked';
    }

    function convertDriveUrl(url) {
      const raw = normalizeText(url);
      if (!raw) return '';

      let match = raw.match(/\/file\/d\/([^/]+)/);
      if (match && match[1]) {
        return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000';
      }

      match = raw.match(/[?&]id=([^&]+)/);
      if (match && match[1] && raw.indexOf('drive.google.com') !== -1) {
        return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000';
      }

      return raw;
    }

    function getRawValues(row) {
      const data = row && row.data ? row.data : {};
      if (Array.isArray(data.values)) return data.values;
      if (data.row && typeof data.row === 'object') {
        return Object.keys(data.row).map(function(key) { return data.row[key]; });
      }
      return [];
    }

    function getSupabaseSourceId(sourceKey) {
      const sources = (window.COMSW_SUPABASE_CONFIG && window.COMSW_SUPABASE_CONFIG.sources) || {};
      return sources[sourceKey] || sourceKey || 'main';
    }

    async function fetchSupabaseRowsForSheet(sheetName, sourceId) {
      const source = sourceId || getSupabaseSourceId('main');
      const cacheKey = source + '::' + sheetName;
      if (window.ComswSupabase && typeof window.ComswSupabase.fetchSheetRows === 'function') {
        return window.ComswSupabase.fetchSheetRows(sheetName, source);
      }
      if (supabaseSheetCache[cacheKey]) return supabaseSheetCache[cacheKey];

      const endpoint = SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + SUPABASE_RAW_TABLE;
      const url = endpoint
        + '?select=source_id,sheet_name,row_number,data'
        + '&source_id=eq.' + encodeURIComponent(source)
        + '&sheet_name=eq.' + encodeURIComponent(sheetName)
        + '&order=row_number.asc';

      const res = await fetch(url, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY
        }
      });

      if (!res.ok) {
        throw new Error('Supabase HTTP ' + res.status + ' / ' + await res.text());
      }

      const rows = await res.json();
      supabaseSheetCache[cacheKey] = rows || [];
      return supabaseSheetCache[cacheKey];
    }

    async function getDepartmentListFromSupabase() {
      const rows = await fetchSupabaseRowsForSheet(CURRICULUM_SHEET_NAME);
      const departments = [];
      const seen = {};

      rows.forEach(function(row) {
        const values = getRawValues(row);
        const name = normalizeText(values[14]);        // O열
        const imageUrl = normalizeText(values[15]);    // P열
        const checked = values[16];                    // Q열
        const description = normalizeText(values[17]); // R열
        if (!name || !truthyCell(checked) || seen[name]) return;
        seen[name] = true;
        departments.push({
          name: name,
          imageUrl: imageUrl ? convertDriveUrl(imageUrl) : '',
          description: description
        });
      });

      return departments;
    }

    async function getCategoryListFromSupabase() {
      const rows = await fetchSupabaseRowsForSheet(CURRICULUM_SHEET_NAME);
      const categories = [];
      const seen = {};

      rows.forEach(function(row) {
        const values = getRawValues(row);
        const name = normalizeText(values[22]); // W열
        const checked = values[23];             // X열
        if (!name || !truthyCell(checked) || seen[name]) return;
        seen[name] = true;
        categories.push({ name: name });
      });

      return categories;
    }

    async function getCurriculumByDeptFromSupabase(deptName) {
      const rows = await fetchSupabaseRowsForSheet(CURRICULUM_SHEET_NAME);
      const deptKeyword = normalizeText(deptName).replace(/학과$/, '').trim();
      let engHeader = '';
      const subjectMap = {};
      const subjectOrder = [];

      rows.forEach(function(row) {
        const values = getRawValues(row);
        const deptFull = normalizeText(values[14]); // O열
        const eng = normalizeText(values[20]);      // U열
        if (deptFull === deptName && eng && !engHeader) engHeader = eng;

        const deptCell = normalizeText(values[1]);      // B열
        const subjectName = normalizeText(values[2]);   // C열
        const weekTitle = normalizeText(values[3]);     // D열
        const content = normalizeText(values[5]);       // F열
        const imageUrl = normalizeText(values[7]);      // H열

        if (!deptCell || deptCell.indexOf(deptKeyword) === -1) return;
        if (!subjectName || !weekTitle) return;

        if (!subjectMap[subjectName]) {
          subjectMap[subjectName] = {
            subjectName: subjectName,
            weeks: []
          };
          subjectOrder.push(subjectName);
        }

        subjectMap[subjectName].weeks.push({
          title: weekTitle,
          content: content,
          img: imageUrl ? convertDriveUrl(imageUrl) : '',
          mediaType: imageUrl ? 'image' : ''
        });
      });

      return {
        engHeader: engHeader,
        subjects: subjectOrder.map(function(name) { return subjectMap[name]; })
      };
    }

    function coursePrepCategoryKey(value) {
      const v = normalizeText(value).replace(/\s+/g, '');
      if (v === '교재명' || v === '교재') return 'textbook';
      if (v === '준비물') return 'supply';
      if (v.toUpperCase() === 'AI툴'.toUpperCase() || v.toLowerCase() === 'aitool' || v === 'AI도구') return 'ai';
      return '';
    }

    async function getCoursePreparationsFromSupabase() {
      let rows = [];
      for (let i = 0; i < COURSE_PREP_SHEET_NAMES.length; i++) {
        rows = await fetchSupabaseRowsForSheet(COURSE_PREP_SHEET_NAMES[i]);
        if (rows.length) break;
      }

      const result = {};
      let curSubject = '';
      let curCategory = '';

      rows.forEach(function(row) {
        const values = getRawValues(row);
        const cellA = normalizeText(values[0]);
        const cellB = normalizeText(values[1]);
        const cellC = normalizeText(values[2]);
        const cellD = normalizeText(values[3]);
        const cellE = normalizeText(values[4]);
        const cellF = normalizeText(values[5]);

        if (cellA) curSubject = cellA;
        if (cellB) curCategory = cellB;
        if (!curSubject) return;

        const cat = coursePrepCategoryKey(curCategory);
        if (!cat) return;
        if (!cellC && !cellD && !cellE && !cellF) return;

        if (!result[curSubject]) result[curSubject] = {};
        if (!result[curSubject][cat]) result[curSubject][cat] = [];
        result[curSubject][cat].push({
          text: cellC,
          link: cellD,
          image: cellE ? convertDriveUrl(cellE) : '',
          pill: cellF
        });
      });

      return result;
    }

    function splitMultiValue(value) {
      return normalizeText(value)
        .split(/[,;\/\n\r]+/)
        .map(normalizeText)
        .filter(Boolean);
    }

    function curriculumMatchKey(value) {
      return normalizeText(value)
        .replace(/[~～]/g, '~')
        .replace(/\s+/g, '')
        .toLowerCase();
    }

    function mergeSubjectLists(primary, secondary) {
      const merged = [];
      const seen = {};
      (primary || []).concat(secondary || []).forEach(function(subjectName) {
        const clean = normalizeText(subjectName);
        const key = curriculumMatchKey(clean);
        if (!clean || seen[key]) return;
        seen[key] = true;
        merged.push(clean);
      });
      return merged;
    }

    function buildInstructorCurriculumRecords(rows) {
      const records = [];
      let currentInstructor = '';
      let currentSubject = '';

      (rows || []).forEach(function(row) {
        const values = getRawValues(row);
        const inst = normalizeText(values[0]);    // A열
        const subj = normalizeText(values[1]);    // B열
        const title = normalizeText(values[2]);   // C열
        const content = normalizeText(values[4]); // E열
        const img = normalizeText(values[5]);     // F열

        if (inst) currentInstructor = inst;
        if (subj) currentSubject = subj;
        if (!currentInstructor || !currentSubject || !title) return;

        records.push({
          instructor: currentInstructor,
          subjectName: currentSubject,
          title: title,
          content: content,
          img: img ? convertDriveUrl(img) : '',
          mediaType: img ? 'image' : ''
        });
      });

      return records;
    }

    function buildInstructorSubjectMap(records) {
      const map = {};
      (records || []).forEach(function(record) {
        const instKey = curriculumMatchKey(record.instructor);
        if (!instKey || !record.subjectName) return;
        if (!map[instKey]) map[instKey] = [];
        map[instKey] = mergeSubjectLists(map[instKey], [record.subjectName]);
      });
      return map;
    }

    async function getInstructorListFromSupabase(deptName) {
      const rows = await fetchSupabaseRowsForSheet(INSTRUCTOR_SHEET_NAME);
      let subjectsByInstructor = {};
      try {
        const curriculumRows = await fetchSupabaseRowsForSheet(deptName, getSupabaseSourceId('instructorCurriculum'));
        subjectsByInstructor = buildInstructorSubjectMap(buildInstructorCurriculumRecords(curriculumRows));
      } catch (err) {
        console.warn('강사별 커리큘럼 과목 목록 로드 실패:', err);
      }
      const targetDeptKey = normalizeText(deptName).replace(/\s+/g, '');
      const instructors = [];

      rows.forEach(function(row) {
        const values = getRawValues(row);
        const name = normalizeText(values[0]);      // A열
        const depts = splitMultiValue(values[1]);   // B열
        const subjects = splitMultiValue(values[2]); // C열, 정적 테스트에서는 이 값을 사용
        const career = normalizeText(values[3]);    // D열
        const message = normalizeText(values[4]);   // E열
        const img = normalizeText(values[5]);       // F열
        if (!name) return;

        const matched = depts.some(function(dept) {
          return dept.replace(/\s+/g, '') === targetDeptKey;
        });
        if (!matched) return;

        const externalSubjects = subjectsByInstructor[curriculumMatchKey(name)] || [];

        instructors.push({
          name: name,
          depts: depts,
          subjects: externalSubjects.length ? externalSubjects : subjects,
          career: career,
          message: message,
          img: img ? convertDriveUrl(img) : ''
        });
      });

      return instructors;
    }

    async function getInstructorCurriculumFromSupabase(deptName, instructorName, subjectName) {
      const rows = await fetchSupabaseRowsForSheet(deptName, getSupabaseSourceId('instructorCurriculum'));
      const weeks = [];
      const targetInst = curriculumMatchKey(instructorName);
      const targetSubj = curriculumMatchKey(subjectName);

      buildInstructorCurriculumRecords(rows).forEach(function(record) {
        if (curriculumMatchKey(record.instructor) !== targetInst ||
            curriculumMatchKey(record.subjectName) !== targetSubj) return;
        weeks.push({
          title: record.title,
          content: record.content,
          img: record.img,
          mediaType: record.mediaType
        });
      });

      return { weeks: weeks };
    }

    async function getAllInstructorCurriculumFromSupabase(deptName, instructorName) {
      const rows = await fetchSupabaseRowsForSheet(deptName, getSupabaseSourceId('instructorCurriculum'));
      const items = [];
      const targetInst = curriculumMatchKey(instructorName);

      buildInstructorCurriculumRecords(rows).forEach(function(record) {
        if (curriculumMatchKey(record.instructor) !== targetInst) return;
        items.push({
          subjectName: record.subjectName,
          week: {
            title: record.title,
            content: record.content,
            img: record.img,
            mediaType: record.mediaType
          }
        });
      });

      return { items: items };
    }

    async function getRecruitmentListFromSupabase(deptName) {
      const rows = await fetchSupabaseRowsForSheet(deptName, getSupabaseSourceId('recruitment'));
      return rows.map(function(row) {
        const values = getRawValues(row);
        return {
          company: normalizeText(values[0]),       // A열
          workType: normalizeText(values[5]),      // F열 업무내용
          qualification: normalizeText(values[4]), // E열 자격요건
          workForm: normalizeText(values[3]),      // D열 근무형태
          salary: normalizeText(values[6])         // G열 급여
        };
      }).filter(function(item) {
        return item.company || item.workType || item.qualification || item.workForm || item.salary;
      });
    }

    function setLoadingProgress(percent) {
      document.documentElement.style.setProperty('--loading-progress', Math.max(0, Math.min(100, percent)) + '%');
    }

    function markLoadingStep(step) {
      loadingProgressDone[step] = true;
      let progress = 0;
      Object.keys(loadingProgressSteps).forEach(function(key) {
        if (loadingProgressDone[key]) progress += loadingProgressSteps[key];
      });
      setLoadingProgress(progress);
      tryHideLoadingOverlay();
    }

    function isInitialPageReady() {
      return domReady && loadingContentReady && dataReady && webAppUrlReady;
    }
    
    /* 페이지 진입 로딩 화면 */
    document.addEventListener('DOMContentLoaded', function() {
      tryDisplayCachedLoadingContent();
    });
    
    function tryDisplayCachedLoadingContent() {
      if (isLoadingContentDisplayed) return;
      let cachedList = null;
      try {
        const raw = localStorage.getItem(LOADING_LIST_CACHE_KEY);
        if (raw) cachedList = JSON.parse(raw);
      } catch (e) {}
      if (cachedList && cachedList.length > 0) {
        const picked = cachedList[Math.floor(Math.random() * cachedList.length)];
        displayLoadingContent(picked);
        isLoadingContentDisplayed = true;
      }
    }
    
    function displayLoadingContent(item) {
      const bg = document.getElementById('loading-bg');
      const textEl = document.getElementById('loading-text');
      const cachedImage = getCachedImage(item.id);
      if (cachedImage) bg.src = cachedImage;
      else if (item.imageUrl) bg.src = item.imageUrl;
      textEl.textContent = item.text || '';
      textEl.setAttribute('data-text', item.text || '');
      if (typeof applyLoadingFont === 'function') applyLoadingFont(textEl, item);
      textEl.classList.remove('animate');
      void textEl.offsetWidth;
      textEl.classList.add('animate');
    }
    
    function getCachedImage(id) {
      try {
        const raw = localStorage.getItem(LOADING_CACHE_KEY);
        if (!raw) return null;
        const cache = JSON.parse(raw);
        return cache[id] || null;
      } catch (e) { return null; }
    }
    
    window.onload = function() {
      domReady = true;
      markLoadingStep('dom');

      getDepartmentListFromSupabase()
        .then(onDepartmentsLoaded)
        .catch(onError);

      loadingContentReady = true;
      markLoadingStep('loadingContent');
      webAppUrlReady = true;
      markLoadingStep('webAppUrl');

      // 🎯 "수업별 준비몰(AI/교재 등)" 데이터 로드 → window.coursePreparations 캐싱
      //    슬라이드 빌드 시 makeCurriculumSlide가 이 캐시를 참조해 아이콘을 출력함.
      //    데이터가 늦게 도착하면 이미 빌드된 슬라이드에 아이콘을 동적으로 추가.
      getCoursePreparationsFromSupabase()
        .then(function(map) {
          window.coursePreparations = map || {};
          window._coursePreparationsIndex = null;
          if (typeof injectMissingPrepIcons === 'function') {
            injectMissingPrepIcons();
          }
        })
        .catch(function(err) {
          console.warn('[course preparations] load failed:', err && err.message ? err.message : err);
          window.coursePreparations = {};
          window._coursePreparationsIndex = null;
        });

      setTimeout(function() { tryHideLoadingOverlay(true); }, MAX_LOADING_TIME);
      
      window.addEventListener('resize', applySlideScale);
      
      // 🎯 마우스 호버 감지 시스템 시작
      initHoverDetection();
    };
    
    function tryHideLoadingOverlay(force) {
      const elapsed = Date.now() - loadingStartTime;
      const overlay = document.getElementById('loading-overlay');
      if (overlay.classList.contains('lock')) return;
      if (force) {
        if (isInitialPageReady()) {
          setLoadingProgress(100);
          overlay.classList.add('hidden');
        }
        return;
      }
      if (isInitialPageReady() && elapsed >= MIN_LOADING_TIME) {
        setLoadingProgress(100);
        overlay.classList.add('hidden');
      } else if (isInitialPageReady() && elapsed < MIN_LOADING_TIME) {
        setTimeout(function() {
          if (!overlay.classList.contains('lock')) {
            setLoadingProgress(100);
            overlay.classList.add('hidden');
          }
        }, MIN_LOADING_TIME - elapsed);
      }
    }
    
    /* ============================================== */
    /*  🎯 마우스 호버 감지 - 버튼 자동 표시/숨김         */
    /* ============================================== */
    
    function initHoverDetection() {
      const HOVER_RIGHT_EDGE = 100;   // 오른쪽 100px 이내
      const HOVER_CORNER = 200;        // 모서리 200px 이내
      
      document.addEventListener('mousemove', function(e) {
        const x = e.clientX;
        const y = e.clientY;
        const w = window.innerWidth;
        const h = window.innerHeight;
        
        const slideNav = document.getElementById('slide-nav');
        const backBtn = document.getElementById('back-btn');
        const closeBtn = document.getElementById('close-btn');
        const expandBtn = document.getElementById('expand-btn');
        
        // 1️⃣ 오른쪽 ↑/↓ 버튼 - 패널 열려있을 때만
        if (activeDeptName) {
          if (x > w - HOVER_RIGHT_EDGE) {
            slideNav.classList.add('visible');
          } else {
            slideNav.classList.remove('visible');
          }
        } else {
          slideNav.classList.remove('visible');
        }
        
        // 2️⃣ 좌하단 < 버튼 - 항상 가능
        const inLeftBottom = (x < HOVER_CORNER) && (y > h - HOVER_CORNER);
        if (inLeftBottom) {
          backBtn.classList.add('visible');
        } else {
          backBtn.classList.remove('visible');
        }
        
        // 3️⃣ 우하단 ×, 확대 버튼 - 패널 열려있을 때만
        const inRightBottom = (x > w - HOVER_CORNER) && (y > h - HOVER_CORNER);
        if (activeDeptName && inRightBottom) {
          closeBtn.classList.add('visible');
          expandBtn.classList.add('visible');
        } else {
          closeBtn.classList.remove('visible');
          expandBtn.classList.remove('visible');
        }
      });
      
      // 마우스가 화면 밖으로 나가면 모든 버튼 숨김
      document.addEventListener('mouseleave', function() {
        document.getElementById('slide-nav').classList.remove('visible');
        document.getElementById('back-btn').classList.remove('visible');
        document.getElementById('close-btn').classList.remove('visible');
        document.getElementById('expand-btn').classList.remove('visible');
      });
    }
    
    /* 학과 렌더링 */
    function onDepartmentsLoaded(departments) {
      departmentsData = departments || [];
      const container = document.getElementById('departments');
      
      if (departmentsData.length === 0) {
        container.innerHTML = '<li class="dept-item" style="cursor:default;">표시할 학과가 없습니다</li>';
        dataReady = true;
        markLoadingStep('data');
        tryHideLoadingOverlay();
        return;
      }
      
      container.innerHTML = '';
      departmentsData.forEach(dept => {
        const item = document.createElement('li');
        item.className = 'dept-item';
        item.textContent = dept.name;

        item.addEventListener('mouseenter', function() {
          if (activeDeptName) return;
          showDescription(dept);   // 🎯 dept 객체 전체 전달 (이미지 + 설명)
        });

          hideDescription();

        item.addEventListener('click', function() {

      markLoadingStep('data');
      tryHideLoadingOverlay();

    function onError(err) {
      const container = document.getElementById('departments');
      container.innerHTML = '<li class="dept-item" style="cursor:default;">오류: ' + (err.message || err) + '</li>';
      dataReady = true;
      markLoadingStep('data');
      tryHideLoadingOverlay();
    }
    
    /* 🎯 학과 호버 시 표시: 이미지(P열, blur 처리) + 설명 텍스트(R열) */
    function showDescription(dept) {
      const wrapper = document.getElementById('dept-description');
      const img     = document.getElementById('dept-description-image');
      const blurImg = document.getElementById('dept-description-image-blur');
      const textEl  = document.getElementById('dept-description-text');
      if (!wrapper || !img || !blurImg || !textEl) return;

      const imageUrl   = (dept && dept.imageUrl) || '';
      const description = (dept && dept.description) || '';

      // 이미지 처리
      if (imageUrl) {
        img.src = imageUrl;
        blurImg.src = imageUrl;
        img.style.display = '';
        blurImg.style.display = '';
        // 이미지 로딩 실패 시 이미지 숨김 (텍스트는 그대로 표시)
        img.onerror = function() {
          img.style.display = 'none';
          blurImg.style.display = 'none';
          img.removeAttribute('src');
          blurImg.removeAttribute('src');
        };
      } else {
        img.removeAttribute('src');
        blurImg.removeAttribute('src');
        img.style.display = 'none';
        blurImg.style.display = 'none';
      }

      // 텍스트
      textEl.textContent = description;

      // 둘 다 비어있으면 안 보이게
      if (imageUrl || description) wrapper.classList.add('visible');
      else wrapper.classList.remove('visible');
    }

      document.getElementById('dept-description').classList.remove('visible');

    /* ============================================== */
    /*  🎯 확대/축소 토글 - 부드러운 애니메이션           */
    /* ============================================== */

    let scaleAnimFrameId = null;

    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      const panel = document.getElementById('slide-panel');
      const expandIcon = document.getElementById('expand-icon');
      const collapseIcon = document.getElementById('collapse-icon');
      
      if (isFullscreen) {
        panel.classList.add('fullscreen');
        document.body.classList.add('panel-fullscreen');
        expandIcon.style.display = 'none';
        collapseIcon.style.display = 'block';
      } else {
        panel.classList.remove('fullscreen');
        document.body.classList.remove('panel-fullscreen');
        expandIcon.style.display = 'block';
        collapseIcon.style.display = 'none';
      }
      
      // 🎯 트랜지션 진행 중 매 프레임마다 스케일 재계산
      smoothApplySlideScale();
    }

    function smoothApplySlideScale() {
      // 이전 애니메이션 취소
      if (scaleAnimFrameId) {
        cancelAnimationFrame(scaleAnimFrameId);
      }
      
      const startTime = performance.now();
      const TRANSITION_DURATION = 600;  // CSS transition과 동일
      
      function tick() {
        applySlideScale();
        const elapsed = performance.now() - startTime;
        
        if (elapsed < TRANSITION_DURATION + 50) {  // 약간의 여유
          scaleAnimFrameId = requestAnimationFrame(tick);
        } else {
          scaleAnimFrameId = null;
          // 마지막에 한 번 더 정확히 맞춤
          applySlideScale();
        }
      }
      
      scaleAnimFrameId = requestAnimationFrame(tick);
    }
    
    /* ============================================== */
    /*  🎯 학과 데이터 + 카테고리 데이터 동시 로드        */
    /* ============================================== */

    function loadCurriculum(deptName) {
      const container = document.getElementById('scale-container');
      container.innerHTML = '';
      ensurePageIndicator();
      document.getElementById('slide-empty').style.display = 'block';
      document.getElementById('slide-empty').textContent = '데이터를 불러오는 중...';
      
      // 두 데이터를 병렬로 로드
      let curriculumData = null;
      let categoryList = null;
      let errorOccurred = false;
      
      function tryBuildAll() {
        if (curriculumData === null || categoryList === null) return;  // 둘 다 로드 완료될 때까지 대기
        if (errorOccurred) return;
        
        if (!categoryList || categoryList.length === 0) {
          document.getElementById('slide-empty').textContent = '표시할 카테고리가 없습니다.\n"컴수원_전체수업" 시트 X열 체크박스를 확인해주세요.';
          return;
        }
        
        document.getElementById('slide-empty').style.display = 'none';
        buildAllSlides(deptName, curriculumData, categoryList);
      }
      
      // 1. 커리큘럼 데이터 로드 (학과별)
      getCurriculumByDeptFromSupabase(deptName)
        .then(function(data) {
          if (data.error) {
            document.getElementById('slide-empty').textContent = data.error;
            errorOccurred = true;
            return;
          }
          curriculumData = data;
          tryBuildAll();
        })
        .catch(function(err) {
          document.getElementById('slide-empty').textContent = '오류: ' + (err.message || err);
          errorOccurred = true;
        });
      
      // 2. 카테고리 목록 로드 (전체 학과 공통)
      getCategoryListFromSupabase()
        .then(function(list) {
          categoryList = list || [];
          tryBuildAll();
        })
        .catch(function(err) {
          document.getElementById('slide-empty').textContent = '카테고리 로드 오류: ' + (err.message || err);
          errorOccurred = true;
        });
    }

    /* ============================================== */
    /*  🎯 모든 카테고리 슬라이드 통합 생성              */
    /* ============================================== */

    function ensurePageIndicator() {
      const container = document.getElementById('scale-container');
      if (!container) return null;

      let panel = document.getElementById('page-indicator');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'page-indicator';
      }

      if (panel.parentElement !== container) {
        container.appendChild(panel);
      }

      return panel;
    }

    function buildAllSlides(deptName, curriculumData, categoryList) {
      const container = document.getElementById('scale-container');
      container.innerHTML = '';
      ensurePageIndicator();
      slides = [];
      currentSlideIndex = 0;
      
      const engHeader = curriculumData.engHeader || '';
      
      // W열 순서대로 카테고리 처리
      categoryList.forEach(category => {
        const catName = category.name;
        
        if (catName === '커리큘럼') {
          // 🎯 커리큘럼 카테고리 - 학과의 과목별 슬라이드들 생성
          const curriculumSlides = createCurriculumPages(
            deptName,
            engHeader,
            curriculumData.subjects
          );
          curriculumSlides.forEach(slide => {
            container.appendChild(slide);
            slides.push(slide);
          });
        } else if (catName === '학과 강사소개') {
          // 🎯 강사소개 카테고리 - 강사 목록 페이지들 (3명씩 분할, 배열 반환)
          const instructorSlides = createInstructorPages(deptName, engHeader, catName);
          instructorSlides.forEach(slide => {
            container.appendChild(slide);
            slides.push(slide);
          });
        } else if (catName === '채용정보') {
          // 🎯 채용정보 카테고리 - 학과별 시트에서 채용공고 목록 (10행씩 분할, 배열 반환)
          const recruitmentSlides = createRecruitmentPages(deptName, engHeader);
          recruitmentSlides.forEach(slide => {
            container.appendChild(slide);
            slides.push(slide);
          });
        } else if (
          // 🎯 취업 프로세스 카테고리 - 공백 유무 둘 다 안전 매칭
          (catName || '').replace(/\s+/g, '') === '취업프로세스'
        ) {
          const employmentSlide = createEmploymentPage(deptName, engHeader);
          container.appendChild(employmentSlide);
          slides.push(employmentSlide);
        } else {
          // 🎯 나머지 카테고리 - 임시 페이지 생성
          const genericSlide = createGenericCategoryPage(deptName, engHeader, catName);
          container.appendChild(genericSlide);
          slides.push(genericSlide);
        }
      });  // ← forEach 닫음
      
      if (slides.length > 0) {
        slides[0].classList.add('active');
      }
      
      buildIndicator(slides.length);
      updateIndicator();
      updateNavButtons();
      
      setTimeout(applySlideScale, 50);
    }
    
    
    
    /* ============================================== */
    /*  🎯 슬라이드 스케일링                              */
    /*    패널 크기에 맞춰서 자동 조정                    */
    /* ============================================== */
    
    function applySlideScale() {
      const view = document.querySelector('.slide-view');
      if (!view) return;
      const vw = view.clientWidth;
      const vh = view.clientHeight;
      const scale = Math.min(vw / 1920, vh / 1080);
      const container = document.getElementById('scale-container');
      container.style.transform = 'scale(' + scale + ')';
      container.style.left = ((vw - 1920 * scale) / 2) + 'px';
      container.style.top = ((vh - 1080 * scale) / 2) + 'px';
    }
    
    function buildIndicator(count) {
      const panel = ensurePageIndicator();
      if (!panel) return;
      panel.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.addEventListener('click', () => goToSlide(i));
        panel.appendChild(dot);
      }
    }
    
    function updateIndicator() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, i) => {
        if (i === currentSlideIndex) dot.classList.add('active');
        else dot.classList.remove('active');
      });
    }
    
    function updateNavButtons() {
      const firstBtn = document.getElementById('nav-first');
      const lastBtn = document.getElementById('nav-last');
      firstBtn.disabled = currentSlideIndex === 0;
      lastBtn.disabled = currentSlideIndex >= slides.length - 1;
    }
    
    function goToSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      slides[currentSlideIndex].classList.remove('active');
      currentSlideIndex = idx;
      slides[currentSlideIndex].classList.add('active');
      updateIndicator();
      updateNavButtons();
    }
    
    // 🎯 첫/마지막 페이지 이동
    document.getElementById('nav-first').addEventListener('click', () => goToSlide(0));
    document.getElementById('nav-last').addEventListener('click', () => goToSlide(slides.length - 1));
    
    // 마우스 휠로 슬라이드 이동
    let wheelAccum = 0;
    let wheelTimer = null;
    const WHEEL_THRESH = 50;
    document.getElementById('slide-panel').addEventListener('wheel', function(e) {
      if (!activeDeptName) return;
      wheelAccum += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAccum = 0; }, 200);
      if (wheelAccum >= WHEEL_THRESH) {
        wheelAccum = 0;
        goToSlide(currentSlideIndex + 1);
      } else if (wheelAccum <= -WHEEL_THRESH) {
        wheelAccum = 0;
        goToSlide(currentSlideIndex - 1);
      }
    }, { passive: true });
    
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ============================================== */
      /*  🎯 라이트박스 - 썸네일 확대 보기                  */
      /* ============================================== */
      
      let currentLightboxIndex = -1;
      
    function openLightbox(index) {
      if (!window.flatWeeksForLightbox || window.flatWeeksForLightbox.length === 0) return;
      if (index < 0 || index >= window.flatWeeksForLightbox.length) return;
      
      // 🎯 클릭한 썸네일의 호버 상태 강제 해제 (transform: scale 복귀)

    function closeLightbox() {
      document.getElementById('lightbox-overlay').classList.remove('visible');
      currentLightboxIndex = -1;
      // 🎯 유튜브 영상 정지 (iframe 제거)
      const wrapper = document.getElementById('lightbox-media-wrapper');
      wrapper.innerHTML = '';

      // 🎯 모든 썸네일 호버 상태 초기화 (인라인 스타일 제거)
      document.querySelectorAll('.img-box img').forEach(img => {
        img.style.transform = '';
      });

      // 🎯 강사 라이트박스에서 띄운 경우 flatWeeksForLightbox 백업 복원
      //    (category_instructor.html의 openInstructorWeekLightbox가 백업해둔 데이터 복원)
      if (window._flatWeeksBackupForInstructor !== undefined) {
        window.flatWeeksForLightbox = window._flatWeeksBackupForInstructor;
        window._flatWeeksBackupForInstructor = undefined;
      }
    }
      
      /* 🎯 유튜브 URL에서 비디오 ID 추출 */
      function extractYoutubeId(url) {
        if (!url) return null;
        const patterns = [
          /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
          /(?:youtube\.com\/shorts\/)([^&\n?#]+)/
        ];
        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match && match[1]) return match[1];
        }
        return null;
      }
      
      function renderLightbox() {
        const item = window.flatWeeksForLightbox[currentLightboxIndex];
        if (!item) return;
        
        const wrapper = document.getElementById('lightbox-media-wrapper');
        wrapper.innerHTML = '';
        
        const mediaUrl = item.week.img;
        const youtubeId = extractYoutubeId(mediaUrl);
        
        if (youtubeId) {
          // 🎯 유튜브 영상
          // autoplay=1: 자동재생 / mute=1: 음소거 / loop=1: 반복재생
          // controls=0: 컨트롤바 숨김 (호버 트리거로 표시) / playlist={id}: loop 작동 필수
          // playsinline=1: 모바일 인라인 재생 / rel=0: 관련 영상 안 보임
          const embedUrl = 'https://www.youtube.com/embed/' + youtubeId 
                        + '?autoplay=1&mute=1&loop=1&playlist=' + youtubeId
                        + '&controls=1&playsinline=1&rel=0&modestbranding=1';
          
          const iframe = document.createElement('iframe');
          iframe.src = embedUrl;
          iframe.allow = 'autoplay; encrypted-media';
          iframe.allowFullscreen = true;
          wrapper.appendChild(iframe);
          
          // 호버 트리거 (평소엔 덮개로 컨트롤 숨김 효과)
          const trigger = document.createElement('div');
          trigger.className = 'youtube-hover-trigger';
          wrapper.appendChild(trigger);
        } else if (mediaUrl) {
          // 🎯 일반 이미지
          const img = document.createElement('img');
          img.src = mediaUrl;
          img.alt = '';
          img.onerror = function() {
            wrapper.innerHTML = '<span class="no-img">참고 이미지 없음</span>';
          };
          wrapper.appendChild(img);
        } else {
          // 🎯 이미지 없음
          const noImg = document.createElement('span');
          noImg.className = 'no-img';
          noImg.textContent = '참고 이미지 없음';
          wrapper.appendChild(noImg);
        }
        
        document.getElementById('lightbox-subject').textContent = item.subjectName;
        document.getElementById('lightbox-week').textContent = item.week.title;
        document.getElementById('lightbox-content-text').textContent = item.week.content || '';
        
        // 좌우 버튼 상태
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');
        prevBtn.disabled = currentLightboxIndex === 0;
        nextBtn.disabled = currentLightboxIndex >= window.flatWeeksForLightbox.length - 1;
      }
      
      function lightboxPrev() {
        if (currentLightboxIndex > 0) {
          currentLightboxIndex--;
          renderLightbox();
        }
      }
      
      function lightboxNext() {
        if (currentLightboxIndex < window.flatWeeksForLightbox.length - 1) {
          currentLightboxIndex++;
          renderLightbox();
        }
      }
      
      // 라이트박스 이벤트 등록
      document.getElementById('lightbox-prev').addEventListener('click', function(e) {
        e.stopPropagation();
        lightboxPrev();
      });
      document.getElementById('lightbox-next').addEventListener('click', function(e) {
        e.stopPropagation();
        lightboxNext();
      });
      
      // 🎯 실제 콘텐츠 요소들만 클릭 차단 (빈 영역은 닫기 동작)
      document.getElementById('lightbox-media-wrapper').addEventListener('click', function(e) {
        e.stopPropagation();
      });
      document.querySelector('.lightbox-text').addEventListener('click', function(e) {
        e.stopPropagation();
      });
      
      // 배경(오버레이) 클릭하면 닫기
      document.getElementById('lightbox-overlay').addEventListener('click', function() {
        closeLightbox();
      });
    
    /* 메인으로 이동 */
    function showLoadingAndNavigate(targetUrl) {
      if (isNavigating) return;
      isNavigating = true;
      
      const overlay = document.getElementById('loading-overlay');
      const bg = document.getElementById('loading-bg');
      const textEl = document.getElementById('loading-text');
      const isOverlayVisible = !overlay.classList.contains('hidden');
      setLoadingProgress(0);
      
      if (isOverlayVisible && isLoadingContentDisplayed) {
        overlay.classList.add('lock');
        textEl.classList.remove('animate');
        void textEl.offsetWidth;
        textEl.classList.add('animate');
        setLoadingProgress(25);
      } else {
        let picked = null;
        try {
          const raw = localStorage.getItem(LOADING_LIST_CACHE_KEY);
          if (raw) {
            const list = JSON.parse(raw);
            if (list.length > 0) picked = list[Math.floor(Math.random() * list.length)];
          }
        } catch (e) {}
        
        if (picked) {
          const cachedImage = getCachedImage(picked.id);
          bg.src = cachedImage || picked.imageUrl;
          textEl.textContent = picked.text || '';
          textEl.setAttribute('data-text', picked.text || '');
          if (typeof applyLoadingFont === 'function') applyLoadingFont(textEl, picked);
        } else {
          textEl.textContent = '';
          textEl.setAttribute('data-text', '');
          if (typeof applyLoadingFont === 'function') applyLoadingFont(textEl, null);
        }
        
        overlay.classList.remove('hidden');
        overlay.classList.add('lock');
        textEl.classList.remove('animate');
        void textEl.offsetWidth;
        textEl.classList.add('animate');
        setLoadingProgress(25);
      }
      
      requestAnimationFrame(function() { setLoadingProgress(100); });
      setTimeout(function() { window.top.location.href = targetUrl; }, 2500);
    }
    
    function goHome() {
      if (cachedWebAppUrl) showLoadingAndNavigate(cachedWebAppUrl);
      else {
        window.location.href = './index.html';
      }
    }
    
    document.addEventListener('keydown', function(e) {
          // 🎯 강사 커리큘럼 라이트박스가 열려있으면 무조건 우선
          //   - window._instructorCurriculumOpen 플래그를 1순위로 본다.
          //     visible 클래스 체크가 타이밍/상속/CSS 차이로 false가 되는 케이스를 대비.
          //   - capture 단계 + stopImmediatePropagation으로 다른 ESC 핸들러가
          //     같은 ESC에 끼어들어 강사 라이트박스까지 닫는 사이드이펙트 차단.
          const curriculumLb = document.getElementById('instructor-curriculum-lightbox');
          const instructorCurriculumOpen = !!window._instructorCurriculumOpen
            || (curriculumLb && curriculumLb.classList.contains('visible'));
          if (instructorCurriculumOpen && e.key === 'Escape') {
            closeInstructorCurriculum();
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return;
          }

          // 🎯 강사 상세 라이트박스 (X 버튼과 동일하게 force=true로 통째로 닫기)
          const instructorLightboxOpen = document.getElementById('instructor-lightbox').classList.contains('visible');
          if (instructorLightboxOpen && e.key === 'Escape') {
            closeInstructorLightbox(true);
            return;
          }
          
          // 🎯 일반 라이트박스 (커리큘럼 썸네일)
          const lightboxOpen = document.getElementById('lightbox-overlay').classList.contains('visible');
          
          if (lightboxOpen) {
            if (e.key === 'Escape') {
              closeLightbox();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              lightboxPrev();
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              lightboxNext();
            }
            return;
          }
          
          // 일반 슬라이드 모드
          if (e.key === 'Escape' && activeDeptName) {
            closePanel();
            return;
          }
          if (activeDeptName && slides.length > 0) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
              e.preventDefault();
              goToSlide(currentSlideIndex + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
              e.preventDefault();
              goToSlide(currentSlideIndex - 1);
            }
          }
        }, true);  // 🎯 capture 단계: window 등록 ESC 핸들러보다 먼저 발동

        /* ============================================== */
        /*  🎯 강사 라이트박스 이벤트 등록                   */
        /* ============================================== */
        
        // 강사 상세 라이트박스 - 빈 공간(블러 배경) 클릭 시 닫기
        document.getElementById('instructor-lightbox').addEventListener('click', function(e) {
          // 강사명/경력/과목 버튼 영역 클릭은 무시 (내부에서 stopPropagation)
          // 빈 검은 영역만 닫기
          if (e.target === e.currentTarget || e.target.classList.contains('instructor-detail-panel')) {
            closeInstructorLightbox();
          }
        });
        
        // 강사 상세 패널 정보 영역 클릭은 차단
        document.querySelector('.instructor-detail-info').addEventListener('click', function(e) {
          e.stopPropagation();
        });
        document.getElementById('instructor-subjects').addEventListener('click', function(e) {
          e.stopPropagation();
        });
        
        // 강사 커리큘럼 라이트박스 - 흰 박스 밖 클릭 시 닫기
        document.getElementById('instructor-curriculum-lightbox').addEventListener('click', function(e) {
          if (e.target === e.currentTarget) {
            closeInstructorCurriculum();
          }
        });
        
        // 흰 박스 내부 클릭은 닫기 차단
        document.getElementById('instructor-curriculum-box-content').addEventListener('click', function(e) {
          e.stopPropagation();
        });

  </script>
