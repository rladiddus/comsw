<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>컴수원 관리</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://bpdxbqsvkvvybrtgvrnf.supabase.co" crossorigin>
  <link rel="stylesheet" href="./v4.css">
</head>
<body>
  <div id="loginWrap" class="login">
    <main class="card">
      <h1>컴수원 관리</h1>
      <p class="muted">쌤톡 아이디로 로그인하세요</p>
      <div id="loadingView" class="muted">불러오는 중...</div>
      <section id="loginView" hidden>
        <form id="loginForm" autocomplete="on">
          <label for="loginId">아이디 또는 이메일</label>
          <input id="loginId" name="id" autocomplete="username" required>
          <label for="loginPw">비밀번호</label>
          <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
          <button type="submit" class="btn primary">로그인</button>
        </form>
      </section>
      <p id="loginError" class="error" role="alert"></p>
    </main>
  </div>

  <div id="appView" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span></span>컴수원</div>
      <nav id="sideNav" aria-label="관리 메뉴"></nav>
    </aside>
    <div class="work">
      <header class="top">
        <span id="crumb"></span>
        <div class="user">
          <span id="userName"></span>
          <span id="userRole" class="pill"></span>
          <button id="logoutBtn" type="button" class="btn">로그아웃</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <script src="../assets/js/supabase-config.js"></script>
  <script type="module" src="./js/main.mjs"></script>
</body>
</html>
