<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>컴수원 관리</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f6f6f6; color: #1a1a1a;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px;
      background: #fff; border-radius: 16px; padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 14px; color: #777; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
    input {
      width: 100%; height: 46px; padding: 0 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font: inherit; font-size: 15px;
    }
    input:focus { outline: 2px solid #fa491d; outline-offset: -1px; border-color: transparent; }
    button {
      width: 100%; height: 48px; margin-top: 22px;
      border: 0; border-radius: 8px; background: #fa491d; color: #fff;
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #2a2a2a; }
    .error { min-height: 20px; margin-top: 12px; font-size: 13px; color: #e03131; }
    .status-row { font-size: 15px; margin-top: 8px; }
    .role-badge {
      display: inline-block; margin-left: 6px; padding: 2px 10px;
      border-radius: 12px; background: #fa491d; color: #fff; font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>컴수원 관리</h1>
    <p class="sub">쌤톡 아이디로 로그인하세요</p>

    <div id="loadingView">불러오는 중...</div>

    <section id="loginView" hidden>
      <form id="loginForm" autocomplete="on">
        <label for="loginId">아이디 또는 이메일</label>
        <input id="loginId" name="id" autocomplete="username" required>
        <label for="loginPw">비밀번호</label>
        <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
      </form>
    </section>
    <p id="loginError" class="error" role="alert"></p>

    <section id="statusView" hidden>
      <p class="status-row"><span id="statusEmail"></span><span id="statusRole" class="role-badge"></span></p>
      <button id="logoutBtn" type="button" class="secondary">로그아웃</button>
    </section>
  </main>

  <script src="../assets/js/supabase-config.js"></script>
  <script type="module" src="./js/main.mjs"></script>
</body>
</html>
