  <div id="loginWrap" class="login">
    <main class="card">
      <h1>컴수원 관리</h1>
      <p class="muted">쌤톡 아이디로 로그인하세요</p>
      <div id="loadingView" class="muted">불러오는 중...</div>
      <section id="loginView" hidden>
        <form id="loginForm" autocomplete="on">
          <label for="loginId">아이디 또는 이메일</label>
          <input id="loginId" name="id" autocomplete="username" required>
          <label for="loginPw">비밀번호</label>
          <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
          <button type="submit" class="btn primary">로그인</button>
        </form>
      </section>
      <p id="loginError" class="error" role="alert"></p>
    </main>
  </div>

  <div id="appView" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span></span>컴수원</div>
      <nav id="sideNav" aria-label="관리 메뉴"></nav>
    </aside>
    <div class="work">
      <header class="top">
        <span id="crumb"></span>
        <div class="user">
          <span id="userName"></span>
          <span id="userRole" class="pill"></span>
          <button id="logoutBtn" type="button" class="btn">로그아웃</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>
